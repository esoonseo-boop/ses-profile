function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type || 'ok');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = 'toast'; }, 4000);

function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
function ssDel(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
function confirmButton(label, confirmLabel, onConfirm, cls){
  let armed = false, timer;
  const b = el('button', {class: cls || 'btn danger sm', type:'button', text:label, onclick: async () => {
    if (!armed){ armed = true; b.textContent = confirmLabel; timer = setTimeout(() => { armed = false; b.textContent = label; }, 3000); return; }
    clearTimeout(timer); armed = false; b.disabled = true;

const AI_MAX_CHARS = 150000;
const AI_SYSTEM = `당신은 은행 지점장의 인사상담 기록을 정리하는 비서입니다. 입력은 클로바노트로 녹음한 직원 상담 녹취 텍스트입니다.

/* ---------- 입력 점검: 개인식별/민감정보 방지 ---------- */
const BLOCK = [
  [/\d{6}\s*-?\s*[1-4]\d{6}/, '주민등록번호 형식'],
  [/\b0\d{1,2}\s*-?\s*\d{3,4}\s*-?\s*\d{4}\b/, '전화번호 형식'],
  [/[\w.+-]+@[\w-]+\.[\w.]+/, '이메일 주소'],
  [/\d{3,}-\d{2,}-\d{4,}/, '계좌번호로 보이는 숫자']
];
const SENSITIVE = ['건강','질병','병원','진단','우울','치료','수술','임신','가정사','이혼','가족','종교','정당','노조','징계','소송','고소','폭언','괴롭힘'];
function scan(...texts){
  const t = texts.filter(Boolean).join(' \n ');
  const block = BLOCK.filter(([re]) => re.test(t)).map(x => x[1]);
  const warn = SENSITIVE.filter(w => t.includes(w));
  return { block, warn };
}

let session = null;
try{ session = JSON.parse(ssGet(SESSION_KEY) || 'null'); }catch(e){ session = null; }
function saveSession(s){
  session = s ? { access_token:s.access_token, refresh_token:s.refresh_token,
                  expires_at: Math.floor(Date.now()/1000) + (s.expires_in || 3600),
                  email: (s.user && s.user.email) || (session && session.email) || '' } : null;
  if (session) ssSet(SESSION_KEY, JSON.stringify(session)); else ssDel(SESSION_KEY);
}
const authCall = (grant, body) => fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
  method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
async function refreshSession(){
  if (!session || !session.refresh_token) return false;
  try{ const res = await authCall('refresh_token', { refresh_token: session.refresh_token });
       if (!res.ok){ saveSession(null); return false; } saveSession(await res.json()); return true; }
  catch(e){ return false; }
}
async function api(path, opts){
  opts = opts || {};
  if (session && session.expires_at - Math.floor(Date.now()/1000) < 60) await refreshSession();
  const send = () => fetch(SUPABASE_URL + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + (session ? session.access_token : SUPABASE_KEY) },
                           opts.body ? {'Content-Type':'application/json'} : {}, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  let res = await send();
  if (res.status === 401 && session && await refreshSession()) res = await send();
  return res;
}

async function loadAll(){
  // 서버(RLS)가 같은 지점 데이터만 돌려주며, 화면에서도 내 지점으로 한 번 더 제한한다
  const br = '&branch_name=eq.' + encodeURIComponent(me.branch_name);
  const [a, b] = await Promise.all([
    api('/rest/v1/staff_members?select=*' + br + '&order=created_at.asc'),
    api('/rest/v1/staff_counsels?select=*' + br + '&order=counsel_date.desc,created_at.desc')
  ]);
  if (!a.ok || !b.ok){
    const code = a.ok ? b.status : a.status;
    if (code === 401 || code === 403) return 'noauth';
    if (code === 404) return 'notable';
    return 'error';
  }
  S.staff = await a.json(); S.counsels = await b.json(); return 'ok';
}
async function loadMe(){
  const res = await api('/rest/v1/proposal_admins?select=email,role,display_name,branch_name,manager_name&email=eq.' + encodeURIComponent((session.email || '').toLowerCase()));
  if (!res.ok) return null;
  const row = (await res.json())[0];
  return row && MANAGER_ROLES.includes(row.role) ? row : null;
}
async function start(){
  if (!session){ renderLogin(); return false; }
  // 지점장 계정인지 먼저 확인 — 직원 계정이면 데이터를 읽기 전에 즉시 로그아웃
  me = await loadMe();
  if (!me){ saveSession(null); renderLogin('지점장 계정만 사용할 수 있습니다.'); return false; }
  const r = await loadAll();
  if (r === 'noauth'){ saveSession(null); renderLogin('이 계정은 직원 상담 관리 권한이 없습니다.'); return false; }
  if (r === 'notable'){ saveSession(null); renderLogin('DB 설정(staff_notes.sql)이 아직 적용되지 않았습니다.'); return false; }
  if (r === 'error'){ saveSession(null); renderLogin('불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); return false; }
  armIdle(); render(); return true;
}

/* ---------- 계산 ---------- */
const countsOf = (id) => S.counsels.filter(c => c.staff_id === id);
function summary(){
  const today = todayStr();
  const active = S.staff.filter(s => s.active);
  const info = active.map(s => {
    const cs = countsOf(s.id), last = cs[0] || null;
    const next = last && last.next_date ? last.next_date : null;
    return { s, cs, last, gap: last ? dayDiff(today, last.counsel_date) : null, next };
  });
  const open = S.counsels.filter(c => c.follow_up && !c.follow_done)
    .sort((a, b) => (a.follow_due || '9999').localeCompare(b.follow_due || '9999'));
  const soon = info.filter(i => i.next && dayDiff(i.next, today) <= 7).sort((a, b) => a.next.localeCompare(b.next));
  const soonIds = new Set(soon.map(i => i.s.id));
  const gapList = info.filter(i => !soonIds.has(i.s.id) && (i.gap == null || i.gap > GAP_DAYS))
    .sort((a, b) => (b.gap == null ? 1e9 : b.gap) - (a.gap == null ? 1e9 : a.gap));
  return { today, active, info, open, soon, gapList };
}

function viewDash(){
  const m = summary(), today = m.today;
  const nm = (st) => st ? [st.initials, st.name_masked].filter(Boolean).join(' · ') : '?';
  const toNew = (id) => { openStaff(id); S.dtab = 'new'; render(); };      // 상담 등록 탭으로 바로 이동
  const items = [];
  m.open.forEach(c => { const st = staffById(c.staff_id), late = c.follow_due && c.follow_due < today;
    items.push({ k:'follow', pri: late ? 0 : 2, sort: c.follow_due || '9999', label:'후속 조치', badge: late ? ['red', '기한 지남'] : null,
      st, title: c.follow_up, sub: `상담 ${fmtD(c.counsel_date)}${c.follow_due ? ` · 기한 ${fmtD(c.follow_due)}` : ''}`, c }); });
  m.soon.forEach(i => { const d = dayDiff(i.next, today);
    items.push({ k:'soon', pri: d < 0 ? 0 : 1, sort: i.next, label:'상담 예정', badge: [d < 0 ? 'red' : 'amber', d < 0 ? `${-d}일 지남` : d === 0 ? '오늘' : `D-${d}`],

  m.gapList.forEach(i => items.push({ k:'gap', pri:3, sort:'9999', label:'상담 공백', badge: ['amber', i.gap == null ? '첫 상담 필요' : `${i.gap}일째`],
    st: i.s, title: i.gap == null ? '상담 기록 없음' : `마지막 상담 ${fmtD(i.last.counsel_date)}`, sub: [i.s.team, i.s.rank_title].filter(Boolean).join(' · '), go: () => toNew(i.s.id) }));
  items.sort((a, b) => a.pri - b.pri || String(a.sort).localeCompare(String(b.sort)));
  const cnt = (k) => k === 'all' ? items.length : items.filter(x => x.k === k).length;
  const f = S.dfilter || 'all';
  const seg = el('div', {class:'seg', role:'tablist'}, [['all','전체'], ['follow','후속 조치'], ['soon','상담 예정'], ['gap','상담 공백']].map(([k, t]) =>
    el('button', {class:'seg-b' + (f === k ? ' on' : ''), type:'button', text:`${t} ${cnt(k)}`, onclick: () => { S.dfilter = k; render(); }})));
  const rows = items.filter(x => f === 'all' || x.k === f).map(x => {
    const chk = x.k === 'follow' ? el('input', {type:'checkbox', 'aria-label':'이행 완료', onchange: async (e) => { await toggleFollow(x.c, e.target.checked); }}) : null;
    return el('div', {class:'rowitem'}, chk,
      el('div', {class:'grow click', style:'cursor:pointer', onclick: () => x.c ? openCounsel(x.c) : x.go()},
        el('div', {class:'t'}, el('span', {class:'badge gray', text:x.label}), ' ', x.title),
        el('div', {class:'s', text: [nm(x.st), x.sub].filter(Boolean).join(' · ')})),
      x.badge ? el('span', {class:'badge ' + x.badge[0], text:x.badge[1]}) : null);

  return el('div', {},

      el('div', {class:'hint', style:'margin-top:10px;', text:`재직 ${m.active.length}명 · 상담 공백 기준 ${GAP_DAYS}일 · 항목을 누르면 상세로 이동합니다.`})));

/* ---------- 인사 상세 항목 ---------- */
const EXTRA = [
  ['name_masked','성명(마스킹)','text',10],['team','팀','text',20],['emp_no','직번','text',10],['birth_on','출생년월(일은 01)','date'],
  ['grade','급','num',9],['step','호봉','num',99],['rank_date','현직급 발령일','date'],['entered_on','입행일','date'],
  ['education','최종학력','text',40],['major','전공','text',40],['cohort','기수','text',30],['entry_note','입행비고','text',40],
  ['loan_years','여신 경력','text',10],['loan_mgmt','관리 경력','text',10],['fx_years','외환 경력','text',10],
  ['married','결혼(Y/N)','text',1],['hap_year','합년','num',2100],['recent_dept','최근부서(직전)','text',40],
  ['career','근무이력(최근→과거)','area',300]
];
function ageOf(d){ const t = new Date(), b = new Date(d); let a = t.getFullYear() - b.getFullYear(); if (t.getMonth() < b.getMonth()) a--; return a; }   // 월 기준 만 나이
function spanOf(d){   // 오늘까지 경과 기간 (년.월)
  if (!d) return ''; const t = new Date(), b = new Date(d);
  let m = (t.getFullYear() - b.getFullYear()) * 12 + t.getMonth() - b.getMonth() - (t.getDate() < b.getDate() ? 1 : 0);
  if (m < 0) return '예정';
  return `${Math.floor(m / 12)}.${m % 12}`;   // 년.월 (예: 18년 1개월 → 18.1)
}
const withSpan = (d, label) => d ? `${d} (${label ? label + ' ' : ''}${spanOf(d)})` : null;
function staffExtra(s){
  const v = (k) => (s[k] == null || s[k] === '') ? null : String(s[k]);
  const item = (l, val, w) => val ? el('div', {class:'hr-i' + (w ? ' w' : '')}, el('small', {text:l}), el('span', {text:val})) : null;
  const gp = (t, items, w) => { const it = items.filter(Boolean); return it.length ? el('div', {class:'hr-g' + (w ? ' w' : '')}, el('h3', {text:t}), el('div', {class:'hr-grid'}, it)) : null; };
  const career = v('career');
  const chips = career ? el('div', {class:'chips'}, career.split('←').flatMap((x, i, arr) => [
      el('span', {class:'chip' + (i === 0 ? ' cur' : ''), text:x.trim()}), i < arr.length - 1 ? el('i', {text:'←'}) : null])) : null;
  const groups = [
    gp('직급·직번', [item('팀', v('team')), item('직번', v('emp_no')), item('출생년월', s.birth_on ? `${s.birth_on.slice(0, 7)} (만 ${ageOf(s.birth_on)}세)` : null), item('급·호봉', s.grade ? `${s.grade}급` + (s.step ? ` ${s.step}호` : '') : null),
      item('부임일(현 소속)', withSpan(v('joined_on'))), item('현직급 발령일', withSpan(v('rank_date'))), item('입행일', withSpan(v('entered_on')))]),
    gp('학력·입행', [item('최종학력', v('education')), item('전공', v('major')), item('기수', v('cohort')), item('입행구분', v('entry_note'))]),
    gp('경력·기타', [item('여신 경력', v('loan_years')), item('관리 경력', v('loan_mgmt')), item('외환 경력', v('fx_years')), item('합년', v('hap_year')), item('결혼', v('married') === 'Y' ? '기혼' : (v('married') === 'N' ? '미혼' : null))]),
    gp('근무이력', [item('직전 부서', v('recent_dept')), chips ? el('div', {class:'hr-i w'}, el('small', {text:'최근 → 과거'}), chips) : null])
  ].filter(Boolean);
  if (!groups.length) return null;
  return el('div', {class:'hr'}, groups);
}

function staffForm(s){
  const isNew = !s;

    active: el('input', {type:'checkbox'})
  };
  const ex = {};
  EXTRA.forEach(([k, l, t, mx]) => {
    ex[k] = t === 'area' ? el('textarea', {maxlength:mx, style:'min-height:56px'}) : el('input', {type: t === 'date' ? 'date' : (t === 'num' ? 'number' : 'text'), maxlength: t === 'text' ? mx : undefined});
    ex[k].value = s && s[k] != null ? s[k] : '';
  });
  const exBody = () => { const b = {}; EXTRA.forEach(([k, l, t]) => { const v = ex[k].value.trim(); b[k] = v === '' ? null : (t === 'num' ? Number(v) : v); }); return b; };
  f.memo.value = s && s.memo || ''; f.active.checked = s ? s.active : true;
  const msg = el('div', {class:'hint', style:'min-height:18px;'});
  let warned = false;
  const save = async (btn) => {
    msg.className = 'hint'; msg.textContent = '';
    const ini = f.initials.value.trim();
    if (!/^[A-Za-z0-9ㄱ-ㅎ]{1,6}$/.test(ini)){ msg.className = 'hint err'; msg.textContent = '이니셜은 영문·숫자 또는 자음(ㅅㅇㅅ) 1~6자만 가능합니다. 실명(한글)은 입력할 수 없습니다.'; return; }
    if (S.staff.some(x => x.initials.toLowerCase() === ini.toLowerCase() && (!s || x.id !== s.id))){ msg.className = 'hint err'; msg.textContent = '이미 같은 이니셜이 있습니다. 구분되게 바꿔 주세요. (예: SAS2)'; return; }
    const sc = scan(f.rank.value, f.duties.value, f.memo.value);
    if (sc.block.length){ msg.className = 'hint err'; msg.textContent = `입력할 수 없는 정보가 있습니다: ${sc.block.join(', ')}`; return; }
    if (sc.warn.length && !warned){ warned = true; msg.className = 'hint warn'; msg.textContent = `민감할 수 있는 표현(${sc.warn.join(', ')})이 있습니다. 꼭 필요한 경우만 남기고, 저장하려면 한 번 더 누르세요.`; return; }
    const body = { branch_name: me.branch_name, initials: ini, rank_title: f.rank.value.trim() || null, duties: f.duties.value.trim() || null,
                   joined_on: f.joined.value || null, memo: f.memo.value.trim() || null, active: f.active.checked, ...exBody() };
    btn.disabled = true;
    try{
      const res = isNew ? await api('/rest/v1/staff_members', { method:'POST', headers:{Prefer:'return=representation'}, body })
                        : await api('/rest/v1/staff_members?id=eq.' + s.id, { method:'PATCH', headers:{Prefer:'return=representation'}, body });
      if (!res.ok){ toast(await errMsg(res, '저장하지 못했습니다.'), 'err'); return; }
      const row = (await res.json())[0];
      if (isNew) S.staff.push(row); else Object.assign(s, row);
      toast('저장했습니다.'); S.editStaff = false;
      if (isNew){ S.view = 'staff'; } render();
    } finally { btn.disabled = false; }
  };
  const saveBtn = el('button', {class:'btn primary', type:'button', text:'저장', onclick: () => save(saveBtn)});
  return el('div', {class:'card'}, el('h2', {text: isNew ? '직원 추가' : '직원 정보 수정'}),
    el('p', {class:'desc', text:'실명 대신 이니셜만 사용합니다.'}),
    el('div', {class:'row2'},
      el('div', {class:'field'}, el('label', {}, '이니셜 ', el('span', {class:'req', text:'*'})), f.initials),
      el('div', {class:'field'}, el('label', {}, '직급 ', el('span', {class:'opt', text:'(선택)'})), f.rank)),
    el('div', {class:'row2'},
      el('div', {class:'field'}, el('label', {}, '담당 업무 ', el('span', {class:'opt', text:'(선택)'})), f.duties),
      el('div', {class:'field'}, el('label', {}, '부임일 ', el('span', {class:'opt', text:'(선택)'})), f.joined)),
    el('details', {class:'fdet', open: !!s}, el('summary', {text:'인사 상세정보'}),
      el('div', {class:'row2'}, ...EXTRA.filter(e => e[2] !== 'area').map(([k, l]) => el('div', {class:'field'}, el('label', {text:l}), ex[k]))),
      el('div', {class:'field'}, el('label', {text:'근무이력(최근→과거)'}), ex.career)),
    el('div', {class:'field'}, el('label', {}, '메모 ', el('span', {class:'opt', text:'(선택, 200자)'})), f.memo),
    el('label', {class:'inline', style:'margin-bottom:10px;'}, f.active, '재직 중 (해제하면 대시보드에서 제외)'),
    msg, el('div', {class:'actions'}, saveBtn,
      el('button', {class:'btn', type:'button', text:'취소', onclick: () => { S.editStaff = false; if (isNew) S.view = 'staff'; render(); }}),
      !isNew ? confirmButton('직원 삭제', '정말 삭제 (상담 이력도 함께 삭제)', async () => {
        const res = await api('/rest/v1/staff_members?id=eq.' + s.id, { method:'DELETE' });
        if (!res.ok){ toast(await errMsg(res, '삭제하지 못했습니다.'), 'err'); return; }

        S.view = 'staff'; S.sel = null; S.editStaff = false; toast('삭제했습니다.'); render();

    c.next_date ? el('div', {class:'s', style:'margin-top:10px; font-size:13px; color:var(--ink-soft);', text:`다음 상담 예정 ${fmtD(c.next_date)}`}) : null,

  if (S.editStaff) return staffForm(null);

  const q = el('input', {type:'search', placeholder:'이니셜·이름·팀·직급·업무 검색', maxlength:30, value: S.staffQ || ''});
  const box = el('div', {});
  const draw = () => {
    S.staffQ = q.value.trim(); const kw = S.staffQ.toLowerCase();
    const list = S.staff.filter(s => (S.showInactive || s.active) &&
      (!kw || [s.initials, s.name_masked, s.team, s.rank_title, s.duties, s.emp_no].filter(Boolean).join(' ').toLowerCase().includes(kw)));
    const rows = list.map(s => {
      const cs = countsOf(s.id), last = cs[0];
      return el('div', {class:'rowitem click' + (s.active ? '' : ' dim'), onclick: () => openStaff(s.id)},
        el('div', {class:'ava', text:s.initials}),
        el('div', {class:'grow'}, el('div', {class:'t'}, [s.name_masked, s.team, s.rank_title, s.duties].filter(Boolean).join(' · ') || '(정보 없음)'),
          el('div', {class:'s', text: last ? `마지막 상담 ${fmtD(last.counsel_date)} (${dayDiff(today, last.counsel_date)}일 전) · 총 ${cs.length}회` : '상담 기록 없음'})),
        s.active ? null : el('span', {class:'badge gray', text:'비재직'}));
    });
    box.replaceChildren(
      el('div', {class:'hint', style:'margin:8px 0;', text:`${list.length}명`}),
      rows.length ? el('div', {class:'list'}, rows) : el('div', {class:'empty', text: kw ? '검색 결과가 없습니다.' : '등록된 직원이 없습니다. 아래 버튼으로 추가하세요.'}));
  };
  q.addEventListener('input', draw);
  draw();
  return el('div', {},
    el('div', {class:'card'}, el('h2', {text:'직원 목록'}), el('p', {class:'desc', text:'직원을 눌러 인사정보와 상담 이력을 확인·등록합니다.'}),
      q, box,
      el('div', {class:'actions', style:'margin-top:12px;'},
        el('button', {class:'btn primary', type:'button', text:'+ 직원 추가', onclick: () => { S.editStaff = true; render(); }}),
        el('label', {class:'inline'}, el('input', {type:'checkbox', checked: S.showInactive, onchange: (e) => { S.showInactive = e.target.checked; render(); }}), '비재직 포함'))));
}

function openStaff(id){ S.sel = id; S.view = 'detail'; S.dtab = 'info'; S.editStaff = false; S.editCounsel = null; render(); window.scrollTo(0, 0); }

async function toggleFollow(c, done){
  const res = await api('/rest/v1/staff_counsels?id=eq.' + c.id, { method:'PATCH', headers:{Prefer:'return=representation'}, body:{ follow_done: done } });
  if (!res.ok){ toast(await errMsg(res, '저장하지 못했습니다.'), 'err'); render(); return; }
  c.follow_done = done; toast(done ? '이행 완료로 표시했습니다.' : '미이행으로 되돌렸습니다.'); render();
}

function counselForm(s, c){
  const isNew = !c;
  const cf = (c && c.form) || {};
  const half = (new Date().getMonth() < 6) ? '상반기' : '하반기';
  const f = {
    date: el('input', {type:'date', value: c ? c.counsel_date : todayStr()}),
    period: el('input', {type:'text', maxlength:20, value: (c && c.period) || `${String(new Date().getFullYear()).slice(2)}년 ${half}`, placeholder:'예: 26년 하반기'}),
    kind: el('select', {}, KINDS.map(k => el('option', {value:k, text:k}))),
    sum: el('textarea', {maxlength:500, placeholder:'상담 종합 요약 (500자 이내) — AI 요약 시 자동 입력됩니다'}),
    fu: el('input', {type:'text', maxlength:200, value: c && c.follow_up || '', placeholder:'예: 6월 내 여신 교육 신청 지원'}),
    due: el('input', {type:'date', value: c && c.follow_due || ''}),
    next: el('input', {type:'date', value: c && c.next_date || ''}),
    dur: el('input', {type:'number', min:1, max:600, step:1, inputmode:'numeric', value: c && c.duration_min || '', placeholder:'분', style:'width:110px;'})
  };
  f.kind.value = c ? c.kind : '업무'; f.sum.value = c ? c.summary : '';
  const cnt = el('span', {class:'hint', text:`${f.sum.value.length}/500`});
  f.sum.addEventListener('input', () => { cnt.textContent = `${f.sum.value.length}/500`; });

  // 양식 항목(텍스트 영역) — 상담 양식(인사/일반)에 따라 구성
  const ftName = 'ftype_' + Math.random().toString(36).slice(2, 8), ftHandlers = [];
  const ftRadios = Object.entries(FORM_TYPES).map(([v, t]) => {
    const r = el('input', {type:'radio', name:ftName, value:v});
    r.addEventListener('change', () => ftHandlers.forEach(h => h()));
    return { v, r, node: el('label', {class:'pill-radio'}, r, el('span', {text:t})) };
  });
  f.ftype = {
    node: el('div', {class:'pill-group', role:'radiogroup'}, ftRadios.map(x => x.node)),
    get value(){ const x = ftRadios.find(x => x.r.checked); return x ? x.v : 'hr'; },
    set value(v){ ftRadios.forEach(x => { x.r.checked = x.v === v; }); },
    addEventListener(ev, fn){ ftHandlers.push(fn); }
  };
  f.ftype.value = (c && c.form_type) || 'hr';
  let ta = {};
  const fbox = el('div', {});
  const buildForm = () => {
    const t = f.ftype.value, old = {};
    Object.keys(ta).forEach(k => { old[k] = ta[k].value; });
    ta = {}; fbox.textContent = '';
    const blocks = []; let lastSec = '';
    groupsOf(t).forEach(g => {
      if (g.sec !== lastSec){ blocks.push(el('h3', {class:'sec', text:g.sec})); lastSec = g.sec; }
      g.items.forEach(([k, l, q, mx]) => {
        ta[k] = el('textarea', {maxlength: mx || 600, style:'min-height:' + (mx && mx <= 200 ? 48 : 56) + 'px', placeholder: q || ''});
        ta[k].value = old[k] != null ? old[k] : (cf[k] || '');
        const cn = mx ? el('div', {class:'hint', style:'text-align:right; margin-top:2px;'}) : null;
        if (cn){ const upd = () => { cn.textContent = `${ta[k].value.length}/${mx}`; }; ta[k].addEventListener('input', upd); upd(); }
        blocks.push(el('div', {class:'field'}, el('label', {text: itemLabel(g, l)}), q ? el('div', {class:'hint', style:'margin:-2px 0 4px;', text:q}) : null, ta[k], cn));
      });
    });
    fbox.append(...blocks);
  };
  f.ftype.addEventListener('change', buildForm);
  buildForm();

  const msg = el('div', {class:'hint', style:'min-height:18px;'});
  let warned = false;

  /* ----- AI 노트 ----- */
  const fileIn = el('input', {type:'file', accept:'.txt,.md,text/plain'});
  const tx = el('textarea', {style:'min-height:90px', placeholder:'클로바노트 텍스트(.txt)를 첨부하면 여기에 표시됩니다. 직접 붙여넣어도 됩니다.'});
  const over = el('input', {type:'checkbox'});
  const aiMsg = el('div', {class:'hint', style:'min-height:18px;'});
  const txCnt = el('span', {class:'hint', text:''});
  const updCnt = () => { txCnt.textContent = tx.value ? `${tx.value.length.toLocaleString()}자` : ''; };
  tx.addEventListener('input', updCnt);
  fileIn.addEventListener('change', async () => {
    const file = fileIn.files && fileIn.files[0]; if (!file) return;
    if (file.size > 3 * 1024 * 1024){ aiMsg.className = 'hint err'; aiMsg.textContent = '파일이 너무 큽니다(3MB 이하).'; fileIn.value = ''; return; }
    try{
      const buf = await file.arrayBuffer();
      let t = new TextDecoder('utf-8').decode(buf);
      if (t.includes('�')) t = new TextDecoder('euc-kr').decode(buf);   // 한글 인코딩이 다른 파일 대비
      tx.value = t.trim(); updCnt();
      aiMsg.className = 'hint'; aiMsg.textContent = `'${file.name}' 불러옴. 내용을 확인한 뒤 요약을 실행하세요.`;
    }catch(e){ aiMsg.className = 'hint err'; aiMsg.textContent = '파일을 읽지 못했습니다.'; }
  });
  const aiBtn = el('button', {class:'btn primary', type:'button', text:'AI로 요약해 양식 채우기', onclick: async () => {
    aiMsg.className = 'hint'; aiMsg.textContent = '';
    const raw = tx.value.trim();
    if (raw.length < 30){ aiMsg.className = 'hint err'; aiMsg.textContent = '상담 녹취 텍스트를 먼저 첨부하거나 붙여넣어 주세요.'; return; }
    let text = maskPII(raw);
    if (text.length > AI_MAX_CHARS){ text = text.slice(0, AI_MAX_CHARS); aiMsg.textContent = `텍스트가 길어 앞 ${AI_MAX_CHARS.toLocaleString()}자만 요약합니다. `; }
    aiBtn.disabled = true; aiBtn.textContent = '요약 중…';
    try{
      const r = await aiSummarize(text, s, f.kind.value, f.ftype.value);
      let n = 0;
      const put = (el_, v) => { v = String(v == null ? '' : v).trim(); if (v && (over.checked || !el_.value.trim())){ el_.value = v; n++; } };
      keysOf(f.ftype.value).forEach(k => put(ta[k], String(r[k] == null ? '' : r[k]).slice(0, Number(ta[k].getAttribute('maxlength')) || 600)));
      put(f.sum, String(r.summary || '').slice(0, 500)); f.sum.dispatchEvent(new Event('input'));
      put(f.fu, String(r.follow_up || '').slice(0, 200));
      const sc = scan(f.sum.value, f.fu.value, ...keysOf(f.ftype.value).map(k => ta[k].value));
      aiMsg.className = 'hint';
      aiMsg.textContent += `${n}개 항목을 채웠습니다. AI 초안이므로 저장 전에 내용을 확인·수정하세요.` + (sc.warn.length ? ` (민감할 수 있는 표현: ${sc.warn.join(', ')})` : '');
      warned = false;
    }catch(e){ aiMsg.className = 'hint err'; aiMsg.textContent = e.message || 'AI 요약에 실패했습니다.'; }
    finally{ aiBtn.disabled = false; aiBtn.textContent = 'AI로 요약해 양식 채우기'; }
  }});
  const aiCard = el('div', {class:'card ai'},
    el('h2', {text:'AI 노트 · 클로바노트 요약'}),
    el('p', {class:'desc', text:'녹음한 상담 내용을 클로바노트에서 텍스트로 내보내 첨부하면, 아래 상담 양식 항목을 자동으로 채웁니다.'}),
    el('div', {class:'field'}, el('label', {text:'상담 양식'}), f.ftype.node),
    el('div', {class:'field'}, el('label', {text:'녹취 텍스트 파일 (.txt)'}), fileIn),
    el('div', {class:'field'}, el('label', {}, '녹취 텍스트 ', txCnt), tx),
    el('div', {class:'field'}, el('label', {class:'inline'}, over, '이미 입력한 항목도 덮어쓰기')),
    el('div', {class:'notice', style:'margin:4px 0 10px;'},
      el('b', {text:'개인정보 안내 · '}),
      '녹취 원문은 저장되지 않고 요약 요청 시에만 Google Gemini로 전송됩니다(주민번호·전화·이메일·계좌 형식은 자동으로 가림). 무료 Gemini 키(서버 공용 키)로 처리되며, 처리 방식은 ',
      el('a', {href:'https://ai.google.dev/gemini-api/terms', target:'_blank', rel:'noopener noreferrer', text:'Gemini API 약관'}),
      '을 확인하고, 민감한 내용이 많은 상담은 직접 작성하세요.'),
    aiMsg, el('div', {class:'actions'}, aiBtn));

  /* ----- 저장 ----- */
  const save = async (btn) => {
    msg.className = 'hint'; msg.textContent = '';
    if (!f.date.value){ msg.className = 'hint err'; msg.textContent = '상담일을 입력하세요.'; return; }
    if (!f.sum.value.trim()){ msg.className = 'hint err'; msg.textContent = '상담 종합 요약을 입력하세요. (AI 요약 시 자동 입력)'; return; }
    if (f.dur.value && !(Number(f.dur.value) >= 1 && Number(f.dur.value) <= 600)){ msg.className = 'hint err'; msg.textContent = '소요시간은 1~600분 사이로 입력하세요.'; return; }
    if (f.due.value && !f.fu.value.trim()){ msg.className = 'hint err'; msg.textContent = '후속 조치 내용을 입력하거나 기한을 지워 주세요.'; return; }
    const form = {};
    keysOf(f.ftype.value).forEach(k => { const v = ta[k].value.trim(); if (v) form[k] = v; });
    const sc = scan(f.sum.value, f.fu.value, f.period.value, ...Object.values(form));
    if (sc.block.length){ msg.className = 'hint err'; msg.textContent = `입력할 수 없는 정보가 있습니다: ${sc.block.join(', ')}`; return; }
    if (sc.warn.length && !warned){ warned = true; msg.className = 'hint warn';
      msg.textContent = `민감할 수 있는 표현(${sc.warn.join(', ')})이 있습니다. 구체 내용은 빼고 "개인 사정 상담" 정도로 적는 것을 권합니다. 그대로 저장하려면 한 번 더 누르세요.`; return; }
    const fu = f.fu.value.trim();
    const body = { branch_name: me.branch_name, staff_id: s.id, counsel_date: f.date.value, kind: f.kind.value, form_type: f.ftype.value, duration_min: f.dur.value ? Math.round(Number(f.dur.value)) : null,
                   period: f.period.value.trim() || null, summary: f.sum.value.trim(), form,
                   follow_up: fu || null, follow_due: fu && f.due.value ? f.due.value : null, next_date: f.next.value || null };
    if (!fu) body.follow_done = false;
    btn.disabled = true;
    try{
      const res = isNew ? await api('/rest/v1/staff_counsels', { method:'POST', headers:{Prefer:'return=representation'}, body })
                        : await api('/rest/v1/staff_counsels?id=eq.' + c.id, { method:'PATCH', headers:{Prefer:'return=representation'}, body });
      if (!res.ok){ toast(await errMsg(res, '저장하지 못했습니다.'), 'err'); return; }
      const row = (await res.json())[0];
      if (isNew) S.counsels.push(row); else Object.assign(c, row);
      S.counsels.sort((a, b) => b.counsel_date.localeCompare(a.counsel_date) || (b.created_at || '').localeCompare(a.created_at || ''));
      S.editCounsel = null; S.dtab = 'hist'; toast('저장했습니다.'); render(); window.scrollTo(0, 0);
    } finally { btn.disabled = false; }
  };
  const saveBtn = el('button', {class:'btn primary', type:'button', text: isNew ? '상담 기록 저장' : '수정 저장', onclick: () => save(saveBtn)});
  const formCard = el('div', {class:'card'}, el('h2', {text: isNew ? '상담 기록 추가' : '상담 기록 수정'}),
    el('p', {class:'desc', text:'위 AI 노트에서 선택한 상담 양식의 항목입니다. 비워 둔 항목은 저장되지 않습니다.'}),
    el('div', {class:'row3'},
      el('div', {class:'field'}, el('label', {}, '상담일 ', el('span', {class:'req', text:'*'})), f.date),
      el('div', {class:'field'}, el('label', {text:'상담 구분'}), f.period),
      el('div', {class:'field'}, el('label', {}, '유형 ', el('span', {class:'req', text:'*'})), f.kind)),
    el('div', {class:'field'}, el('label', {}, '상담 소요시간 ', el('span', {class:'opt', text:'(선택, 분)'})),
      el('div', {style:'display:flex; gap:8px; align-items:center; flex-wrap:wrap;'}, f.dur, [15, 30, 45, 60, 90].map(m =>
        el('button', {class:'btn sm', type:'button', text:`${m}분`, onclick: () => { f.dur.value = m; }})))),
    fbox,
    el('h3', {class:'sec', text:'상담 요약·후속 조치'}),
    el('div', {class:'field'}, el('label', {}, '상담 종합 요약 ', el('span', {class:'req', text:'*'})), f.sum, cnt),
    el('div', {class:'row2'},
      el('div', {class:'field'}, el('label', {}, '후속 조치 ', el('span', {class:'opt', text:'(선택)'})), f.fu),
      el('div', {class:'field'}, el('label', {}, '조치 기한 ', el('span', {class:'opt', text:'(선택)'})), f.due)),
    el('div', {class:'field', style:'max-width:300px;'}, el('label', {}, '다음 상담 예정일 ', el('span', {class:'opt', text:'(선택)'})), f.next),
    msg, el('div', {class:'actions'}, saveBtn,
      !isNew ? el('button', {class:'btn', type:'button', text:'취소', onclick: () => { S.editCounsel = null; S.dtab = 'hist'; render(); }}) : null,
      el('button', {class:'btn', type:'button', text:'빈 양식 인쇄', onclick: () => printForm(s, null, f.ftype.value)})));
  return el('div', {id:'counselForm'}, aiCard, formCard);
}

    tab === 'info' ? el('div', {class:'card'}, staffExtra(s) || el('div', {class:'empty', text:'등록된 인사 상세정보가 없습니다. 위 "정보 수정"에서 입력하세요.'}),
        s.memo ? el('div', {class:'hint', style:'margin-top:10px;', text:`메모: ${s.memo}`}) : null,
        el('div', {class:'actions', style:'margin-top:14px;'}, el('button', {class:'btn primary', type:'button', text:'+ 상담 등록', onclick: () => { S.dtab = 'new'; render(); window.scrollTo(0, 0); }}))) :
    tab === 'new' ? counselForm(s, editing) :
    el('div', {class:'card'}, el('h2', {text:'상담 이력'}),
      cs.length ? el('div', {class:'tl', style:'margin-top:12px;'}, items) : el('div', {class:'empty', text:'아직 상담 기록이 없습니다.'})));
}

/* ---------- 시작 ---------- */
(async function init(){
  if (session){ if (!(await start())) return; } else renderLogin();
})();
</script>
