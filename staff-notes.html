/* ---------- 유틸 ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type || 'ok');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = 'toast'; }, 4000);
}

function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
function ssDel(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
function confirmButton(label, confirmLabel, onConfirm, cls){
  let armed = false, timer;
  const b = el('button', {class: cls || 'btn danger sm', type:'button', text:label, onclick: async () => {
    if (!armed){ armed = true; b.textContent = confirmLabel; timer = setTimeout(() => { armed = false; b.textContent = label; }, 3000); return; }
    clearTimeout(timer); armed = false; b.disabled = true;
    try{ await onConfirm(); } finally { b.disabled = false; b.textContent = label; }

}

const BLOCK = [
  [/\d{6}\s*-?\s*[1-4]\d{6}/, '주민등록번호 형식'],
  [/\b0\d{1,2}\s*-?\s*\d{3,4}\s*-?\s*\d{4}\b/, '전화번호 형식'],
  [/[\w.+-]+@[\w-]+\.[\w.]+/, '이메일 주소'],
  [/\d{3,}-\d{2,}-\d{4,}/, '계좌번호로 보이는 숫자']
];
const SENSITIVE = ['건강','질병','병원','진단','우울','치료','수술','임신','가정사','이혼','가족','종교','정당','노조','징계','소송','고소','폭언','괴롭힘'];
function scan(...texts){
  const t = texts.filter(Boolean).join(' \n ');
  const block = BLOCK.filter(([re]) => re.test(t)).map(x => x[1]);
  const warn = SENSITIVE.filter(w => t.includes(w));
  return { block, warn };
}

function saveSession(s){
  session = s ? { access_token:s.access_token, refresh_token:s.refresh_token,
                  expires_at: Math.floor(Date.now()/1000) + (s.expires_in || 3600),
                  email: (s.user && s.user.email) || (session && session.email) || '' } : null;
  if (session) ssSet(SESSION_KEY, JSON.stringify(session)); else ssDel(SESSION_KEY);

const authCall = (grant, body) => fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
  method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
async function refreshSession(){
  if (!session || !session.refresh_token) return false;
  try{ const res = await authCall('refresh_token', { refresh_token: session.refresh_token });
       if (!res.ok){ saveSession(null); return false; } saveSession(await res.json()); return true; }
  catch(e){ return false; }
}
async function api(path, opts){
  opts = opts || {};
  if (session && session.expires_at - Math.floor(Date.now()/1000) < 60) await refreshSession();
  const send = () => fetch(SUPABASE_URL + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + (session ? session.access_token : SUPABASE_KEY) },
                           opts.body ? {'Content-Type':'application/json'} : {}, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  let res = await send();
  if (res.status === 401 && session && await refreshSession()) res = await send();
  return res;
}

  if (!session){ renderLogin(); return false; }
  // 지점장 계정인지 먼저 확인 — 직원 계정이면 데이터를 읽기 전에 즉시 로그아웃

  if (r === 'error'){ saveSession(null); renderLogin('불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); return false; }

const countsOf = (id) => S.counsels.filter(c => c.staff_id === id);
const fusOf = (counselId) => S.followups.filter(f => f.counsel_id === counselId);
const isOpenFu = (f) => f.status === 'wait' || f.status === 'doing';
const fuLate = (f) => isOpenFu(f) && f.due_date && f.due_date < todayStr();
function summary(){
  const today = todayStr();
  const active = S.staff.filter(s => s.active);
  const info = active.map(s => {
    const cs = countsOf(s.id), last = cs[0] || null;
    const next = last && last.next_date ? last.next_date : null;
    return { s, cs, last, gap: last ? dayDiff(today, last.counsel_date) : null, next };
  });
  const open = S.followups.filter(isOpenFu)
    .sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  const hold = S.followups.filter(f => f.status === 'hold').length;
  const soonD = (() => { const d = new Date(); d.setDate(d.getDate() + 3); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; })();
  const check = S.followups.filter(f => f.check_on && !f.check_done && f.check_on <= soonD)
    .sort((a, b) => a.check_on.localeCompare(b.check_on));
  const soon = info.filter(i => i.next && dayDiff(i.next, today) <= 7).sort((a, b) => a.next.localeCompare(b.next));
  const soonIds = new Set(soon.map(i => i.s.id));
  const gapList = info.filter(i => !soonIds.has(i.s.id) && (i.gap == null || i.gap > GAP_DAYS))
    .sort((a, b) => (b.gap == null ? 1e9 : b.gap) - (a.gap == null ? 1e9 : a.gap));
  return { today, active, info, open, hold, check, soon, gapList };
}

}
async function hqSaveFiles(iv, files){
  const res = await api('/rest/v1/hq_interviews?id=eq.' + iv.id, { method:'PATCH', headers:{Prefer:'return=representation'}, body:{ files, updated_at: new Date().toISOString() } });
  if (!res.ok) return false; iv.files = files; return true;
}
async function hqUpload(iv, file){
  if (file.size > HQ_MAX){ toast('20MB 이하 파일만 첨부할 수 있습니다.', 'err'); return; }
  if (!/\.(pdf|jpe?g|png|webp)$/i.test(file.name)){ toast('PDF 또는 이미지(JPG·PNG·WEBP)만 첨부할 수 있습니다. 한글·워드 파일은 PDF로 저장해 올려 주세요.', 'err'); return; }
  const ext = ((file.name.match(/\.([A-Za-z0-9]{1,5})$/) || [])[1] || 'bin').toLowerCase();
  const path = 'hq/' + iv.id + '/' + Date.now() + '.' + ext;
  toast('업로드 중…');
  const up = await storageCall('POST', path, file, file.type || 'application/octet-stream');
  if (!up.ok){ toast(await errMsg(up, '업로드하지 못했습니다.'), 'err'); return; }
  const list = (iv.files || []).concat([{ path, name: file.name.slice(0, 120), size: file.size, at: new Date().toISOString() }]);
  if (!(await hqSaveFiles(iv, list))){ await storageCall('DELETE', path); toast('파일 정보를 저장하지 못했습니다.', 'err'); return; }
  toast('첨부했습니다.'); render();
}
async function hqOpenFile(f){
  const ext = (f.name.match(/\.([A-Za-z0-9]+)$/) || [])[1] || '', MIME = { pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif' };
  const inline = !!MIME[ext.toLowerCase()];
  const win = inline ? window.open('', '_blank') : null;   // 클릭 직후 탭을 먼저 열어 팝업 차단 방지
  const res = await storageCall('GET', f.path);
  if (!res.ok){ if (win) win.close(); toast('파일을 불러오지 못했습니다.', 'err'); return; }
  const blob = await res.blob(), url = URL.createObjectURL(inline ? new Blob([blob], {type: MIME[ext.toLowerCase()]}) : blob);
  if (win){ win.location.href = url; }
  else { const a = el('a', {href:url, download:f.name}); document.body.append(a); a.click(); a.remove(); }   // 한글·워드 등은 브라우저가 열 수 없어 다운로드
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
function hqFilesBlock(iv){
  const files = iv.files || [];
  const input = el('input', {type:'file', accept:'.pdf,.jpg,.jpeg,.png,.webp', style:'display:none', 'aria-label':'보고서 파일 선택', onchange: () => { const f = input.files[0]; input.value = ''; if (f) hqUpload(iv, f); }});
  return el('div', {class:'hqb'}, el('div', {class:'msec', text:'제출 보고서 파일 (' + files.length + ')'}),
    ...files.map(f => el('div', {class:'hql', style:'display:flex; gap:6px; align-items:center; flex-wrap:wrap;'},
      el('span', {text:'📎 ' + f.name + ' · ' + fmtSize(f.size) + ' · ' + fmtD(f.at.slice(0, 10)), style:'flex:1; min-width:160px; word-break:break-all;'}),
      el('button', {class:'btn sm', type:'button', text:'열기', onclick: () => hqOpenFile(f)}),
      confirmButton('삭제', '정말 삭제', async () => {
        const r = await storageCall('DELETE', f.path);
        if (!r.ok && r.status !== 404){ toast('파일을 삭제하지 못했습니다.', 'err'); return; }
        if (await hqSaveFiles(iv, files.filter(x => x.path !== f.path))){ toast('삭제했습니다.'); render(); } else toast('파일 정보를 갱신하지 못했습니다.', 'err'); }))),
    files.length ? null : el('div', {class:'hint', text:'아직 첨부된 파일이 없습니다.'}),
    el('div', {class:'hint', style:'margin:4px 0;', text:'본부 제출 보고서(PDF·이미지, 20MB 이하 — 한글·워드는 PDF로 저장 후 첨부)를 보관합니다. 지점장만 열람할 수 있습니다.'}),
    input, el('button', {class:'btn sm', type:'button', text:'+ 파일 첨부', onclick: () => input.click()}));
}
function viewHq(){
  const list = S.hq || [], open = hqOpen(), late = open.filter(hqLate).length;
  const items = list.map((iv, i) => {
    const acts = (S.hqa || []).filter(a => a.interview_id === iv.id), done = acts.filter(a => a.status === 'done').length;
    return el('div', {class:'tli'},
      el('div', {class:'d'}, el('span', {class:'no', text:list.length - i}), el('b', {text:iv.period, style:'margin-right:8px;'}), fmtD(iv.interview_on),
        iv.interviewer ? el('span', {class:'badge gray', style:'margin-left:6px;', text:iv.interviewer}) : null,
        acts.length ? el('span', {class:'badge ' + (done === acts.length ? 'green' : 'amber'), style:'margin-left:6px;', text:`이행 ${done}/${acts.length}`}) : null),
      hqSections(iv),
      hqFilesBlock(iv),
      iv.agenda ? el('div', {class:'sm-text', text:'안건: ' + iv.agenda}) : null,
      iv.notes ? el('div', {class:'sm-text', text:'본부 답변·합의: ' + iv.notes}) : null,
      acts.map(a => hqActRow(a, () => render())),
      el('div', {class:'actions', style:'margin-top:6px;'},
        el('button', {class:'btn sm', type:'button', text:'수정·항목 추가', onclick: () => openHqModal(iv)}),
        el('button', {class:'btn sm', type:'button', text:'면담 자료 복사', onclick: () => copyText(hqSummaryText(iv), '면담 자료를 복사했습니다.')}),
        confirmButton('면담 삭제', '정말 삭제', async () => {
          for (const f of (iv.files || [])) await storageCall('DELETE', f.path);
          const res = await api('/rest/v1/hq_interviews?id=eq.' + iv.id, { method:'DELETE' });
          if (!res.ok){ toast(await errMsg(res, '삭제하지 못했습니다.'), 'err'); return; }
          S.hq = S.hq.filter(x => x.id !== iv.id); S.hqa = (S.hqa || []).filter(a => a.interview_id !== iv.id); toast('삭제했습니다.'); render(); })));
  });
  return el('div', {},
    el('div', {class:'card'}, el('h2', {text:'본부 면담 관리'}),
      el('p', {class:'desc', text:'지역본부장 반기 면담의 안건·답변과 약속 사항(건의·요청, 본부 지시) 이행을 관리합니다.'}),
      el('div', {class:'evs'}, el('div', {class:'ev'}, el('b', {text:list.length + '건'}), el('span', {text:'면담 기록'})), el('div', {class:'ev'}, el('b', {text:open.length + '건'}), el('span', {text:'이행 중'})),
        el('div', {class:'ev'}, el('b', {text:late + '건'}), el('span', {text:'기한 지남'}))),
      el('div', {class:'actions'}, el('button', {class:'btn primary', type:'button', text:'+ 면담 등록', onclick: () => openHqModal(null)})),
      items.length ? el('div', {class:'tl', style:'margin-top:14px;'}, items) : el('div', {class:'empty', text:'아직 등록된 본부 면담이 없습니다.'})));
}

/* ---------- 시작 ---------- */
(async function init(){
  if (session){ if (!(await start())) return; } else renderLogin();
})();
</script>
