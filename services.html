<style>
  :root{
    --bg:#FCFCFE;
    --ink:#1E293B;
    --ink-strong:#0F172A;
    --ink-soft:#64748B;
    --brand:#2563EB;
    --brand-dark:#1D4ED8;
    --navy:#14213D;
    --line:#E2E8F0;
    --card:#FFFFFF;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  ::selection{background:var(--brand);color:#fff;}
  .mono{font-family:'JetBrains Mono',monospace;}

  a{color:inherit;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    color:#fff;
    padding:44px 20px 34px;
    background:
      radial-gradient(circle at 80% 20%, rgba(2,132,199,.20) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(0,98,234,.28) 0%, transparent 50%),
      var(--navy);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:36px 36px;
    pointer-events:none;
  }
  .hero-inner{max-width:1040px; margin:0 auto; position:relative; z-index:1;}
  .eyebrow-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:700; letter-spacing:.08em;
    color:#BFDBFE; text-transform:uppercase;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:20px; padding:6px 14px;
    margin:0 0 16px;
  }
  .eyebrow-badge .dot{width:6px; height:6px; border-radius:50%; background:#60A5FA;}
  h1{
    font-weight:800;
    font-size:clamp(24px,4.6vw,34px);
    margin:0 0 12px;
    letter-spacing:-.02em;
    line-height:1.3;
  }
  h1 .grad{
    background:linear-gradient(to right,#60A5FA,#7DD3FC,#A5F3FC);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lead{
    font-size:15px; color:#CBD5E1; max-width:600px; margin:0 0 24px;
  }
  .meta-row{
    display:flex; flex-wrap:wrap; gap:10px 26px;
    font-size:12.5px; color:#93A9C7;
    border-top:1px solid rgba(255,255,255,.14);
    padding-top:16px;
  }
  .meta-row b{color:#60A5FA; font-weight:800; font-size:15px;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:20;
    background:rgba(252,252,254,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
  }
  .toolbar-inner{max-width:1040px; margin:0 auto;}
  .search-wrap{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; margin-bottom:10px;
  }
  .search-wrap svg{flex:0 0 auto; opacity:.45;}
  .search-wrap input{
    border:none; outline:none; flex:1; font-size:14.5px;
    font-family:'Pretendard',sans-serif; color:var(--ink); background:transparent;
  }
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-size:13px; font-weight:600;
    padding:7px 15px; border-radius:20px;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .chip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .chip .n{opacity:.7; margin-left:3px; font-family:'JetBrains Mono',monospace; font-size:11px;}

  /* ---------- Main ---------- */
  main{max-width:1040px; margin:0 auto; padding:34px 20px 70px;}
  .section{margin-bottom:42px;}
  .section-head{margin:0 0 6px;}
  .section-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--brand);
    margin:0 0 6px;
  }
  .section-head h2{
    font-weight:800; font-size:22px; margin:0;
    color:var(--ink-strong); letter-spacing:-.02em;
  }
  .section-desc{
    font-size:13.3px; color:var(--ink-soft); margin:8px 0 18px;
  }

  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
  }
  @media (max-width:700px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-top:4px solid var(--accent, var(--brand));
    border-radius:var(--radius);
    padding:18px 18px 15px;
    display:flex; flex-direction:column; gap:10px;
    transition:box-shadow .18s, transform .18s;
  }
  .card:hover{box-shadow:0 10px 26px rgba(15,23,42,.08); transform:translateY(-2px);}
  .card-title{
    font-size:15.5px; font-weight:700; color:var(--ink-strong);
    margin:0; line-height:1.35;
  }
  .card-desc{font-size:13.3px; color:var(--ink-soft); margin:0; flex:1;}
  .card-foot{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding-top:11px; border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .dept{
    flex:0 0 auto; margin-left:auto;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    color:var(--ink-soft); background:#F1F5F9; border:1px solid var(--line);
    border-radius:20px; padding:4px 10px;
  }
  .file-row{display:flex; flex-wrap:wrap; gap:6px;}
  .file-chip{
    display:inline-flex; align-items:center; gap:4px;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    color:var(--brand-dark); background:#EFF6FF; border:1px solid #DBEAFE;
    border-radius:20px; padding:4px 10px;
    text-decoration:none; white-space:nowrap;
    transition:background .15s;
  }
  .file-chip:hover{background:#DBEAFE;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px;
  }

  /* ---------- Footer ---------- */
  footer{
    background:#fff; border-top:1px solid var(--line);
    padding:24px 20px 30px;
  }
  .footer-inner{
    max-width:1040px; margin:0 auto; font-size:12.5px; color:var(--ink-soft);
  }
  .footer-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--line);
  }
  .footer-inner p{margin:0;}
  .footer-inner a{color:var(--brand); text-decoration:underline;}
  .footer-ci{display:flex; align-items:center; gap:9px;}
  .footer-ci img{width:28px; height:28px; display:block;}
  .footer-ci .name{font-weight:800; color:var(--ink-strong); font-size:14px; letter-spacing:-.01em;}
  .footer-brand{
    font-weight:800; color:var(--ink-strong);
    font-size:14px; letter-spacing:-.01em;
  }
  .footer-contact{
    display:flex; flex-wrap:wrap; gap:8px 20px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px;
  }
  .footer-contact span{white-space:nowrap;}
  .footer-contact b{color:var(--ink); font-weight:700; margin-right:4px;}
</style>

const CAT_COLORS = {
  "컨설팅 & 서비스": "#D97706",
  "판로개척": "#0891B2",
  "지식정보": "#7C3AED",
  "구인": "#059669",
  "기타": "#E11D48",
};

const CAT_EYEBROW = {
  "컨설팅 & 서비스": "ADVISORY & SERVICES",
  "판로개척": "MARKET ACCESS",
  "지식정보": "MARKET INTELLIGENCE",
  "구인": "TALENT & HIRING",
  "기타": "EMPLOYEE WELFARE",
};

const mainEl = document.getElementById('main');
const chipRow = document.getElementById('chipRow');
const searchInput = document.getElementById('searchInput');

const totalCount = DATA.reduce((s,g)=>s+g.items.length,0);
document.getElementById('metaCount').textContent = totalCount;

let activeCat = "전체";

function buildChips(){
  const cats = ["전체", ...DATA.map(g=>g.cat)];
  chipRow.innerHTML = cats.map(c=>{
    const count = c==="전체" ? totalCount : DATA.find(g=>g.cat===c).items.length;
    return `<button class="chip${c===activeCat?' active':''}" data-cat="${c}">${c}<span class="n">${count}</span></button>`;
  }).join('');
  chipRow.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; buildChips(); render(); });
  });
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  let html = '';
  let shown = 0;

  DATA.forEach(group=>{
    if (activeCat !== "전체" && activeCat !== group.cat) return;

    const items = group.items.filter(it=>{
      if(!q) return true;
      return (it.name+it.desc+it.dept+it.who).toLowerCase().includes(q);
    });
    if(items.length === 0) return;
    shown += items.length;

    html += `<section class="section">
      <div class="section-head">
        <p class="section-eyebrow">${CAT_EYEBROW[group.cat] || group.cat}</p>
        <h2>${group.cat}</h2>
      </div>
      <p class="section-desc">${group.desc}</p>
      <div class="grid">`;

    items.forEach(it=>{
      const files = it.attachments || [];
      const chips = files.map(f=>`<a class="file-chip" href="${escapeHtml(f.url)}" target="_blank" rel="noopener">📎 ${escapeHtml(f.label)}</a>`).join('');
      html += `<div class="card" style="--accent:${CAT_COLORS[group.cat] || '#2563EB'}">
        <p class="card-title">${escapeHtml(it.name)}</p>
        <p class="card-desc">${escapeHtml(it.desc)}</p>
        <div class="card-foot">
          <div class="file-row">${chips}</div>
          <span class="dept">${escapeHtml(it.dept)}</span>
        </div>
      </div>`;
    });

    html += `</div></section>`;
  });

  if (shown === 0){
    html = `<div class="empty">검색 결과가 없습니다. 다른 키워드로 다시 시도해 보세요.</div>`;
  }
  mainEl.innerHTML = html;
}

searchInput.addEventListener('input', render);
buildChips();
render();
