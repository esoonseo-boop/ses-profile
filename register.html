<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>비금융서비스 안내 페이지 등록 | IBK기업은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FCFCFE;
    --ink:#1E293B;
    --ink-strong:#0F172A;
    --ink-soft:#64748B;
    --brand:#2563EB;
    --brand-dark:#1D4ED8;
    --navy:#14213D;
    --line:#E2E8F0;
    --card:#FFFFFF;
    --radius:16px;
    --danger:#DC2626;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  ::selection{background:var(--brand);color:#fff;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}

  .hero{
    position:relative; overflow:hidden;
    color:#fff;
    padding:44px 20px 34px;
    background:
      radial-gradient(circle at 80% 20%, rgba(2,132,199,.20) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(0,98,234,.28) 0%, transparent 50%),
      var(--navy);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:36px 36px;
    pointer-events:none;
  }
  .hero-inner{max-width:640px; margin:0 auto; position:relative; z-index:1;}
  .eyebrow-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:700; letter-spacing:.08em;
    color:#BFDBFE; text-transform:uppercase;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:20px; padding:6px 14px;
    margin:0 0 16px;
  }
  .eyebrow-badge .dot{width:6px; height:6px; border-radius:50%; background:#60A5FA;}
  h1{
    font-weight:800;
    font-size:clamp(22px,4.4vw,30px);
    margin:0 0 12px;
  }
  .hero .lead{
    font-size:14.5px;
    color:#CBD5E1;
    max-width:560px;
    margin:0;
  }

  .wrap{max-width:640px; margin:-24px auto 60px; padding:0 20px; position:relative; z-index:2;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 12px 32px rgba(15,23,42,.08);
    padding:28px 24px;
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block; font-size:13px; font-weight:700; color:var(--ink-strong);
    margin-bottom:6px;
  }
  .field label .req{color:var(--danger); margin-left:2px;}
  .field label .opt{color:var(--ink-soft); font-weight:500; margin-left:4px; font-size:12px;}
  .field input{
    width:100%; padding:11px 13px; font-size:14.5px;
    border:1.5px solid var(--line); border-radius:10px;
    font-family:inherit; color:var(--ink-strong);
    background:#fff;
  }
  .field input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .field .hint{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:480px){ .row2{grid-template-columns:1fr;} }

  .submit-btn{
    width:100%; padding:14px; margin-top:6px;
    background:var(--brand); color:#fff; border:none; border-radius:12px;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
    transition:background .15s;
  }
  .submit-btn:hover{background:var(--brand-dark);}
  .submit-btn:disabled{background:#94A3B8; cursor:not-allowed;}

  .error-box{
    display:none;
    background:#FEF2F2; border:1px solid #FECACA; color:var(--danger);
    font-size:13px; border-radius:10px; padding:10px 13px; margin-bottom:16px;
  }

  /* success state */
  .success{display:none;}
  .success .check{
    width:52px; height:52px; border-radius:50%;
    background:#DCFCE7; color:#16A34A;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; margin:0 auto 14px;
  }
  .success h2{font-size:19px; font-weight:800; text-align:center; margin:0 0 6px; color:var(--ink-strong);}
  .success p.sub{font-size:13.5px; color:var(--ink-soft); text-align:center; margin:0 0 20px;}
  .link-box{
    display:flex; align-items:center; gap:8px;
    background:#F1F5F9; border:1.5px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:12px;
  }
  .link-box input{
    flex:1; border:none; background:transparent; font-family:'JetBrains Mono',monospace;
    font-size:12.5px; color:var(--ink-strong); outline:none;
  }
  .copy-btn{
    flex-shrink:0; background:var(--brand); color:#fff; border:none;
    border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  .copy-btn:hover{background:var(--brand-dark);}
  .open-link{
    display:block; text-align:center; font-size:13px; font-weight:700;
    color:var(--brand); text-decoration:none; margin-top:2px;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow-badge"><span class="dot"></span>IBK기업은행 · 비금융서비스 안내 페이지</p>
    <h1>지점 정보 등록</h1>
    <p class="lead">지점명과 연락처만 입력하면, 우리 지점 전용 비금융서비스 안내 링크가 바로 만들어집니다. 서비스 목록·내용은 모든 지점이 동일하게 공유됩니다.</p>
  </div>
</header>

<div class="wrap">
  <div class="card">

    <div id="formView">
      <div class="error-box" id="errorBox"></div>
      <form id="regForm">
        <div class="field">
          <label>지점명 <span class="req">*</span></label>
          <input type="text" id="branchName" placeholder="예: 상록수지점" required>
        </div>
        <div class="field">
          <label>지점장 성함 <span class="req">*</span></label>
          <input type="text" id="managerName" placeholder="예: 서애순" required>
        </div>
        <div class="row2">
          <div class="field">
            <label>휴대폰 <span class="opt">(선택)</span></label>
            <input type="text" id="mobile" placeholder="010-0000-0000">
          </div>
          <div class="field">
            <label>지점 전화 <span class="opt">(선택)</span></label>
            <input type="text" id="tel" placeholder="031-000-0000 (내선 000)">
          </div>
        </div>
        <div class="field">
          <label>이메일 <span class="opt">(선택)</span></label>
          <input type="email" id="email" placeholder="name@ibk.co.kr">
        </div>
        <div class="field">
          <label>지점 주소 <span class="opt">(선택)</span></label>
          <input type="text" id="address" placeholder="예: 15537 경기도 안산시 상록구 본삼로 49">
          <p class="hint">입력하지 않으면 안내 페이지에 주소가 표시되지 않습니다.</p>
        </div>
        <div class="field">
          <label>상담 시간 <span class="opt">(선택)</span></label>
          <input type="text" id="hours" placeholder="평일 09:00–16:00, 사전 예약 시 협의 가능">
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">전용 링크 만들기</button>
      </form>
    </div>

    <div class="success" id="successView">
      <div class="check">✓</div>
      <h2>등록이 완료되었습니다</h2>
      <p class="sub">아래 링크를 저장하거나 고객에게 공유하세요.</p>
      <div class="link-box">
        <input type="text" id="resultLink" readonly>
        <button class="copy-btn" id="copyBtn">복사</button>
      </div>
      <a class="open-link" id="openLink" href="#" target="_blank" rel="noopener">전용 페이지 열어보기 →</a>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://oqeiaaworcarixndtomj.supabase.co";
const SUPABASE_KEY = "sb_publishable_xVY0MJETNgpC820jW4yO1w_XUd9QzqZ";
const PAGE_URL = "https://ses-profile.vercel.app/s";

const form = document.getElementById('regForm');
const errorBox = document.getElementById('errorBox');
const submitBtn = document.getElementById('submitBtn');

function genCode(){
  return (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Math.random().toString(36).slice(2)).slice(0,8);
}

async function insertBranch(payload, attempt){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/branch_registrations`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=representation'
    },
    body: JSON.stringify(payload)
  });
  if (res.status === 409 && attempt < 3){
    payload.code = genCode();
    return insertBranch(payload, attempt + 1);
  }
  if (!res.ok){
    let message = '등록 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.';
    try{
      const body = await res.json();
      if (body && body.message) message = body.message;
    }catch(e){ /* 응답 본문 파싱 실패 시 기본 메시지 사용 */ }
    throw new Error(message);
  }
  return res.json();
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorBox.style.display = 'none';

  const branch_name = document.getElementById('branchName').value.trim();
  const manager_name = document.getElementById('managerName').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  const tel = document.getElementById('tel').value.trim();
  const email = document.getElementById('email').value.trim();
  const address = document.getElementById('address').value.trim();
  const hours = document.getElementById('hours').value.trim();

  if (!branch_name || !manager_name){
    errorBox.textContent = '지점명과 지점장 성함은 필수 입력 항목입니다.';
    errorBox.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '등록 중…';

  try{
    const payload = { code: genCode(), branch_name, manager_name, mobile, tel, email, address, hours };
    await insertBranch(payload, 0);
    const link = `${PAGE_URL}?code=${payload.code}`;
    document.getElementById('resultLink').value = link;
    document.getElementById('openLink').href = link;
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  }catch(err){
    errorBox.textContent = err.message || '등록 중 문제가 발생했습니다.';
    errorBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = '전용 링크 만들기';
  }
});

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const input = document.getElementById('resultLink');
  input.select();
  input.setSelectionRange(0, 99999);
  navigator.clipboard?.writeText(input.value).catch(()=>{ document.execCommand('copy'); });
  const btn = document.getElementById('copyBtn');
  const original = btn.textContent;
  btn.textContent = '복사됨!';
  setTimeout(()=>{ btn.textContent = original; }, 1500);
});
</script>

</body>
</html>
