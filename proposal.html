<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>맞춤 제안서 | IBK기업은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FCFCFE; --ink:#1E293B; --ink-strong:#0F172A; --ink-soft:#64748B;
    --brand:#2563EB; --brand-dark:#1D4ED8; --navy:#14213D; --line:#E2E8F0;
    --card:#FFFFFF; --radius:16px; --danger:#DC2626;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  ::selection{background:var(--brand);color:#fff;}
  a{color:inherit;}
  button{font-family:inherit;}

  .btn{
    flex:1 1 auto; min-width:92px; text-align:center; cursor:pointer;
    font:inherit; font-size:13.5px; font-weight:700; text-decoration:none;
    padding:10px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-strong);
  }
  .btn:hover{border-color:var(--brand); color:var(--brand);}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn.primary:hover{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff;}

  .state{max-width:520px; margin:70px auto; padding:0 24px; text-align:center;}
  .state .ico{font-size:40px; margin-bottom:8px;}
  .state h2{font-size:19px; font-weight:800; color:var(--ink-strong); margin:0 0 8px;}
  .state p{font-size:14px; color:var(--ink-soft); margin:0;}

  /* ================= 한 장씩 보는 뷰어 ================= */
  body.viewing{background:#0B1220; overflow:hidden; padding:0;}
  #viewer{
    position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh;
    display:flex; flex-direction:column; background:#0B1220; color:#E2E8F0;
  }
  .vbar{
    flex:none; min-height:54px; display:flex; align-items:center; gap:8px;
    padding:max(env(safe-area-inset-top),0px) 10px 0; background:#0F172A; border-bottom:1px solid #1E293B;
  }
  .vbtn{
    flex:none; height:38px; min-width:38px; padding:0 12px; border-radius:10px; cursor:pointer;
    font-size:13.5px; font-weight:700; color:#E2E8F0; background:#1E293B; border:1px solid #334155;
  }
  .vbtn:hover{border-color:#60A5FA; color:#fff;}
  .vbtn:disabled{opacity:.35; cursor:default;}
  .vbtn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .vbtn.primary:hover{background:var(--brand-dark);}
  .vbtn.on{background:#1D4ED8; border-color:#60A5FA; color:#fff;}
  .vtitle{flex:1; min-width:0; text-align:center; line-height:1.25;}
  .vtitle b{display:block; font-size:14.5px; font-weight:800; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .vtitle span{font-size:12px; color:#94A3B8;}

  #stage{flex:1; min-height:0; position:relative; overflow:hidden; background:#162033; touch-action:pan-y;}
  .slide{position:absolute; inset:0; display:flex; flex-direction:column; animation:slidein .22s ease-out;}
  .slide.back{animation-name:slideback;}
  @keyframes slidein{from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:none;}}
  @keyframes slideback{from{opacity:0; transform:translateX(-24px);} to{opacity:1; transform:none;}}
  .pagebox{flex:1; min-height:0; display:flex; padding:12px; overflow:hidden;}
  .pagebox.zoom{overflow:auto; -webkit-overflow-scrolling:touch;}
  .scroller{margin:auto; line-height:0;}
  .scroller canvas{display:block; background:#fff; border-radius:4px; box-shadow:0 10px 34px rgba(0,0,0,.5);}
  .pagebox .msg{margin:auto; color:#94A3B8; font-size:14px; text-align:center; line-height:1.6;}
  .pagebox .msg a{color:#93C5FD;}
  .caption{
    flex:none; margin:0 12px 10px; padding:10px 14px; border-radius:10px; font-size:13.5px;
    color:#DBEAFE; background:rgba(37,99,235,.22); border:1px solid rgba(96,165,250,.35);
  }
  .caption b{color:#fff; margin-right:6px;}

  .vfoot{
    flex:none; display:flex; align-items:center; gap:10px; padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:#0F172A; border-top:1px solid #1E293B;
  }
  .vprog{flex:1; min-width:0; text-align:center; font-size:12.5px; color:#94A3B8;}
  .vprog .bar{height:4px; border-radius:2px; background:#1E293B; margin-top:6px; overflow:hidden;}
  .vprog .bar i{display:block; height:100%; background:#3B82F6; transition:width .2s;}

  /* 표지 */
  .cover{
    position:absolute; inset:0; overflow-y:auto; color:#fff; display:flex; flex-direction:column; padding:28px 22px 24px;
    --c-bg:#14213D; --c-g1:rgba(2,132,199,.25); --c-g2:rgba(0,98,234,.30);
    --c-acc:#2563EB; --c-acc-d:#1D4ED8; --c-soft:#BFDBFE; --c-dot:#60A5FA;
    background:
      radial-gradient(circle at 82% 12%, var(--c-g1) 0%, transparent 42%),
      radial-gradient(circle at 12% 88%, var(--c-g2) 0%, transparent 52%),
      var(--c-bg);
    transition:background-color .3s;
  }
  .cover[data-theme="blue"]{--c-bg:#0A2F6B; --c-g1:rgba(56,189,248,.28); --c-g2:rgba(37,99,235,.40); --c-acc:#3B82F6; --c-acc-d:#2563EB; --c-soft:#BAE6FD; --c-dot:#38BDF8;}
  .cover[data-theme="emerald"]{--c-bg:#0B2E2A; --c-g1:rgba(16,185,129,.25); --c-g2:rgba(5,150,105,.32); --c-acc:#059669; --c-acc-d:#047857; --c-soft:#A7F3D0; --c-dot:#34D399;}
  .cover[data-theme="burgundy"]{--c-bg:#3B1020; --c-g1:rgba(244,63,94,.22); --c-g2:rgba(190,18,60,.32); --c-acc:#BE123C; --c-acc-d:#9F1239; --c-soft:#FECDD3; --c-dot:#FB7185;}
  .cover[data-theme="slate"]{--c-bg:#1F2937; --c-g1:rgba(148,163,184,.20); --c-g2:rgba(71,85,105,.38); --c-acc:#475569; --c-acc-d:#334155; --c-soft:#E2E8F0; --c-dot:#94A3B8;}
  .cover[data-theme="gold"]{--c-bg:#2A2111; --c-g1:rgba(245,158,11,.22); --c-g2:rgba(217,119,6,.30); --c-acc:#B45309; --c-acc-d:#92400E; --c-soft:#FDE68A; --c-dot:#FBBF24;}
  .swatches{display:flex; align-items:center; gap:10px; margin-top:18px; font-size:12px; color:#94A3B8;}
  .swatches .sw{width:26px; height:26px; border-radius:50%; cursor:pointer; padding:0; border:2px solid rgba(255,255,255,.28); box-shadow:inset 0 0 0 3px rgba(0,0,0,.18);}
  .swatches .sw[aria-pressed="true"]{border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.35);}
  .cover::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background-image:linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:36px 36px;
  }
  .cover-in{position:relative; z-index:1; width:100%; max-width:560px; margin:auto;}
  .cover-top{position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; max-width:560px; margin:0 auto 18px;}
  .cover-top .eyebrow-badge{margin:0;}
  .ci{display:block; height:36px; width:auto; margin:0; flex-shrink:0;}
  @media (min-width:700px){ .ci{height:46px;} .cover-top{margin-bottom:28px;} }
  .eyebrow-badge{
    display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; letter-spacing:.08em;
    color:var(--c-soft,#BFDBFE); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:20px; padding:6px 14px; margin:0 0 22px;

  .cover h1{font-weight:800; font-size:clamp(26px,6.4vw,38px); line-height:1.25; margin:0 0 14px;}
  .cover h1 small{display:block; font-size:.5em; font-weight:600; color:var(--c-soft); margin-bottom:8px; letter-spacing:.02em;}
  .cover .lead{font-size:15px; color:#CBD5E1; margin:0 0 20px;}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px;}
  .chip{font-size:12.5px; font-weight:600; color:#E2E8F0; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16); border-radius:8px; padding:5px 11px;}
  .toc{list-style:none; margin:0 0 24px; padding:0; border-top:1px solid rgba(255,255,255,.14);}
  .toc li{display:flex; align-items:baseline; gap:12px; padding:11px 2px; border-bottom:1px solid rgba(255,255,255,.14); font-size:15px;}
  .toc .n{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:12.5px; color:var(--c-dot);}
  .toc .t{flex:1; font-weight:700; color:#fff;}
  .toc .p{font-size:12.5px; color:#94A3B8;}
  .cta{
    width:100%; padding:15px; font-size:16px; font-weight:800; border:none; border-radius:12px; cursor:pointer;
    background:var(--c-acc); color:#fff;
  }
  .cta:hover{background:var(--c-acc-d);}
  .cta:disabled{background:#475569; cursor:wait;}
  .cta2{width:100%; margin-top:10px; padding:12px; font-size:14.5px; font-weight:700; border-radius:12px; cursor:pointer; color:#fff; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.28);}
  .cta2:hover{background:rgba(255,255,255,.14);} .cta2:disabled{opacity:.6; cursor:wait;}
  .contact{margin-top:20px; font-size:13px; color:#CBD5E1; line-height:1.6;}
  .contact b{color:#fff; font-size:14.5px;}
  .contact a{color:var(--c-soft); font-weight:700;}
  .cover .disc{margin-top:14px; font-size:11.5px; color:#94A3B8;}

  /* 목차 서랍 */
  .drawer-bg{position:absolute; inset:0; z-index:20; background:rgba(2,6,23,.6);}
  .drawer{
    position:absolute; top:0; bottom:0; left:0; width:min(88vw,360px); z-index:21; overflow-y:auto;
    background:#0F172A; border-right:1px solid #1E293B; padding:14px 12px; animation:slidein .18s ease-out;
  }
  .drawer h3{margin:4px 6px 12px; font-size:14px; color:#94A3B8; font-weight:700;}
  .dline{display:flex; align-items:center; gap:8px; padding:10px; border-radius:10px; cursor:pointer; border:1px solid transparent;}
  .dline:hover{background:#1E293B;}
  .dline.cur{background:#1E293B; border-color:#3B82F6;}
  .dline .n{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:12.5px; color:#60A5FA; min-width:22px;}
  .dline .t{flex:1; min-width:0; font-size:14.5px; font-weight:700; color:#fff;}
  .dline .t span{display:block; font-size:12px; font-weight:500; color:#94A3B8;}
  .dline .vbtn{height:32px; font-size:12.5px; padding:0 10px;}

  /* ===== 대체 화면(PDF.js 불러오기 실패 시): 카드 목록 ===== */
  .hero{
    position:relative; overflow:hidden; color:#fff; padding:44px 20px 52px;
    background:radial-gradient(circle at 80% 20%, rgba(2,132,199,.20) 0%, transparent 40%),
               radial-gradient(circle at 20% 80%, rgba(0,98,234,.28) 0%, transparent 50%), var(--navy);
  }
  .hero-inner{max-width:720px; margin:0 auto; position:relative; z-index:1;}
  .hero h1{font-weight:800; font-size:clamp(22px,5vw,32px); margin:0 0 12px; line-height:1.3;}
  .hero .lead{font-size:14.5px; color:#CBD5E1; margin:0 0 18px; max-width:560px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .wrap{max-width:720px; margin:-26px auto 40px; padding:0 20px; position:relative; z-index:2;}
  .item{
    background:var(--card); border:1px solid var(--line); border-top:3px solid var(--brand);
    border-radius:var(--radius); box-shadow:0 12px 32px rgba(15,23,42,.07); padding:20px 20px 16px; margin-bottom:18px;
  }
  .item-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .num{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:13px; color:var(--brand); background:#EFF6FF; border-radius:8px; padding:3px 9px;}
  .cat{font-size:12px; font-weight:700; color:var(--ink-soft);}
  .pages{margin-left:auto; font-size:12px; color:var(--ink-soft);}
  .item h2{font-size:19px; font-weight:800; color:var(--ink-strong); margin:0 0 6px;}
  .item p.sum{font-size:14px; color:#475569; margin:0;}
  .note{margin:12px 0 0; padding:10px 13px; font-size:13.5px; color:#1E3A8A; background:#EFF6FF; border-left:3px solid var(--brand); border-radius:6px;}
  .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .disclaimer{max-width:720px; margin:0 auto; padding:0 20px 90px; font-size:12px; color:var(--ink-soft);}
  .bar-fixed{position:fixed; left:0; right:0; bottom:0; z-index:10; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  .bar-inner{max-width:720px; margin:0 auto; display:flex; align-items:center; gap:12px;}
  .bar-info{flex:1; min-width:0; font-size:12.5px; line-height:1.4; color:var(--ink-soft);}
  .bar-info b{display:block; font-size:14px; color:var(--ink-strong);}
  .bar-fixed .btn{flex:0 0 auto; min-width:0;}
</style>

<script>

const app = document.getElementById('app');

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}
function showState(icon, title, desc){
  document.body.classList.remove('viewing');
  app.replaceChildren(el('div', {class:'state'},
    el('div', {class:'ico', text:icon}), el('h2', {text:title}), el('p', {text:desc})));

function fmtDate(s){ return String(s).replaceAll('-', '.'); }
function isExpired(s){ return new Date(s + 'T23:59:59+09:00') < new Date(); }
const pad2 = (n) => String(n).padStart(2, '0');

/* ---------- PDF.js ---------- */
let pdfjsPromise = null;
function loadPdfJs(){
  if (pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`;
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`;
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { pdfjsPromise = null; reject(new Error('pdfjs load failed')); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}

/* 다른 도메인(저장소)의 PDF는 download 속성이 무시되므로, 받아서 직접 저장 */
async function downloadPdf(url, filename){
  try{
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }catch(e){
    window.open(url, '_blank', 'noopener');
  }
}

/* ---------- 표지 포함 전체 제안서 PDF 저장 ---------- */
const PDFLIB_VER = "1.17.1";
let pdfLibPromise = null;
function loadPdfLib(){
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (pdfLibPromise) return pdfLibPromise;
  pdfLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/${PDFLIB_VER}/pdf-lib.min.js`;
    s.onload = () => resolve(window.PDFLib);
    s.onerror = () => { pdfLibPromise = null; reject(new Error('pdf-lib load failed')); };
    document.head.appendChild(s);
  });
  return pdfLibPromise;
}
function loadImage(src){
  return new Promise((resolve) => { const im = new Image(); im.onload = () => resolve(im); im.onerror = () => resolve(null); im.src = src; });
}
function toast(msg){
  const t = el('div', {text:msg, style:'position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:99;max-width:86vw;padding:10px 16px;border-radius:10px;background:#0F172A;color:#fff;font-size:13.5px;border:1px solid #334155;box-shadow:0 8px 24px rgba(0,0,0,.4);text-align:center;'});
  document.body.append(t); setTimeout(() => t.remove(), 3800);
}

/* 표지를 캔버스에 직접 그려 이미지(JPEG)로 만든다. W,H = 표지 쪽 크기(pt) */
async function renderCoverJpeg(W, H){
  const v = V.view, b = v.branch;
  const cs = getComputedStyle(coverEl);
  const col = (n, d) => (cs.getPropertyValue(n) || d).trim() || d;
  const C = { bg:col('--c-bg','#14213D'), g1:col('--c-g1','rgba(2,132,199,.25)'), g2:col('--c-g2','rgba(0,98,234,.30)'),
              soft:col('--c-soft','#BFDBFE'), dot:col('--c-dot','#60A5FA') };
  try{ await Promise.all([document.fonts.load('700 24px Pretendard'), document.fonts.load('500 24px Pretendard')]); }catch(e){}
  const ci = await loadImage('/ci.png');

  const px = 1800 / Math.max(W, H), pw = Math.round(W * px), ph = Math.round(H * px);
  const cv = document.createElement('canvas'); cv.width = pw; cv.height = ph;
  const g = cv.getContext('2d');
  const FF = `Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif`;
  const MONO = `'JetBrains Mono', ui-monospace, Menlo, monospace`;

  // 배경
  g.fillStyle = C.bg; g.fillRect(0, 0, pw, ph);
  let gr = g.createRadialGradient(pw * .82, ph * .12, 0, pw * .82, ph * .12, Math.max(pw, ph) * .55);
  gr.addColorStop(0, C.g1); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, pw, ph);
  gr = g.createRadialGradient(pw * .12, ph * .88, 0, pw * .12, ph * .88, Math.max(pw, ph) * .62);
  gr.addColorStop(0, C.g2); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, pw, ph);
  g.strokeStyle = 'rgba(255,255,255,.04)'; g.lineWidth = 1;
  const step = 36 * px * 1.6;
  for (let x = 0; x < pw; x += step){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, ph); g.stroke(); }
  for (let y = 0; y < ph; y += step){ g.beginPath(); g.moveTo(0, y); g.lineTo(pw, y); g.stroke(); }

  const landscape = pw > ph;
  let cw = landscape ? pw * .58 : pw * .84, u = cw / 720;
  const font = (w, size) => `${w} ${size * u}px ${FF}`;
  const wrap = (text, maxW) => {
    const lines = []; let line = '';
    for (const word of String(text).split(/\s+/)){
      const test = line ? line + ' ' + word : word;
      if (g.measureText(test).width <= maxW || !line){ line = test; }
      else { lines.push(line); line = word; }
      while (g.measureText(line).width > maxW){           // 너무 긴 단어는 글자 단위로 자름
        let k = line.length; while (k > 1 && g.measureText(line.slice(0, k)).width > maxW) k--;
        lines.push(line.slice(0, k)); line = line.slice(k);
      }
    }
    if (line) lines.push(line); return lines;
  };
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };
  const pages = (i) => V.docs[i] ? V.docs[i].numPages : (v.items[i].product.pages || 0);

  const body = (x0, y, draw) => {          // draw=false 면 높이만 계산
    const mw = 720 * u; g.textBaseline = 'alphabetic';
    const T = (txt, size, wt, color, dy, lh, maxW) => {
      g.font = font(wt, size); g.fillStyle = color;
      const ls = wrap(txt, maxW || mw);
      ls.forEach((l) => { y += (lh || size * 1.3) * u; if (draw) g.fillText(l, x0, y - (lh || size * 1.3) * u * .22); });
      y += (dy || 0) * u; return ls.length;
    };
    T('맞춤 제안서', 22, 600, C.soft, 6, 30);
    T(`${v.customer} 고객님께`, 48, 800, '#fff', 14, 62);
    if (v.greeting) T(v.greeting, 22, 500, '#CBD5E1', 22, 34);
    // 칩
    const chips = []; if (v.created) chips.push(`제안일 ${fmtDate(v.created)}`); if (v.expires) chips.push(`유효기간 ~ ${fmtDate(v.expires)}`); chips.push(`제안 상품 ${v.items.length}건`);
    g.font = font(600, 19); let cx = x0; y += 4 * u;
    chips.forEach((t) => {
      const w = g.measureText(t).width + 32 * u, h = 40 * u;
      if (cx + w > x0 + mw){ cx = x0; y += (h + 10 * u); }
      if (draw){ rr(cx, y, w, h, 9 * u); g.fillStyle = 'rgba(255,255,255,.10)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1.5; g.stroke();
        g.fillStyle = '#E2E8F0'; g.font = font(600, 19); g.fillText(t, cx + 16 * u, y + 27 * u); }
      cx += w + 10 * u;
    });
    y += 40 * u + 30 * u;
    // 목차
    if (draw){ g.fillStyle = 'rgba(255,255,255,.16)'; g.fillRect(x0, y, mw, 1.5); }
    let pageNo = 2;                                          // 표지가 1쪽
    v.items.forEach((it, i) => {
      const rh = 58 * u;
      if (draw){
        g.font = `800 ${19 * u}px ${MONO}`; g.fillStyle = C.dot; g.fillText(pad2(i + 1), x0 + 2 * u, y + 37 * u);
        g.font = font(700, 24); g.fillStyle = '#fff'; g.fillText(it.product.title, x0 + 52 * u, y + 38 * u);
        const n = pages(i), label = n ? (n > 1 ? `${pageNo}–${pageNo + n - 1}쪽` : `${pageNo}쪽`) : '';
        g.font = font(500, 19); g.fillStyle = '#94A3B8'; g.textAlign = 'right'; g.fillText(label, x0 + mw - 2 * u, y + 37 * u); g.textAlign = 'left';
        g.fillStyle = 'rgba(255,255,255,.16)'; g.fillRect(x0, y + rh, mw, 1.5);
      }
      pageNo += pages(i) || 1; y += rh;
    });
    y += 34 * u;
    T(`${b.name} ${b.manager} 지점장`, 23, 800, '#fff', 4, 32);
    T(`문의 ${b.tel}${b.telExt ? ` (${b.telExt})` : ''}`, 21, 600, C.soft, 20, 30);
    T('본 자료는 상담을 위한 참고용 제안서이며, 실제 상품 조건·금리·한도는 심사 및 거래 실적에 따라 달라질 수 있습니다. 가입 전 상품설명서와 약관을 확인해 주시기 바랍니다.', 16.5, 500, '#94A3B8', 0, 25);
    return y;
  };

  // 높이 측정 후 쪽에 맞게 축소
  const topH = (ci ? 54 : 40) * u, topY = ph * .06;
  const availH = ph - topY - topH - ph * .05 - 20 * u;
  g.font = font(500, 20);
  let h0 = body(0, 0, false);
  if (h0 > availH){ u *= availH / h0; cw = 720 * u; h0 = body(0, 0, false); }
  const x0 = (pw - cw) / 2;

  // 상단: 왼쪽 지점명 배지 / 오른쪽 CI
  const bt = `기업은행 ${b.name}`; g.font = font(700, 19);
  const bw = g.measureText(bt).width + 54 * u, bh = 40 * u, by = topY + (topH - bh) / 2;
  rr(x0, by, bw, bh, 20 * u); g.fillStyle = 'rgba(255,255,255,.08)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1.5; g.stroke();
  g.beginPath(); g.arc(x0 + 20 * u, by + bh / 2, 4 * u, 0, Math.PI * 2); g.fillStyle = C.dot; g.fill();
  g.fillStyle = C.soft; g.textBaseline = 'middle'; g.font = font(700, 19); g.fillText(bt, x0 + 34 * u, by + bh / 2 + 1); g.textBaseline = 'alphabetic';
  if (ci){ const ch = topH, cwid = ci.width * (ch / ci.height); g.drawImage(ci, x0 + cw - cwid, topY, cwid, ch); }

  // 본문(남은 영역 세로 중앙)
  const yStart = topY + topH + 20 * u + Math.max(0, (availH - h0) / 2);
  body(x0, yStart, true);

  const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.92));
  return new Uint8Array(await blob.arrayBuffer());
}

/* 표지 + 모든 상품 PDF를 한 파일로 합쳐 저장 */
async function downloadAll(btn){
  if (!V.view || btn.disabled) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = '만드는 중…';
  try{
    const { PDFDocument } = await withTimeout(loadPdfLib(), 10000);
    const out = await PDFDocument.create();
    const srcs = await Promise.all(V.view.items.map(async (it) => {
      try{
        const res = await fetch(it.product.url); if (!res.ok) throw new Error(res.status);
        return await PDFDocument.load(await res.arrayBuffer(), { ignoreEncryption:true });
      }catch(e){ return null; }
    }));
    const first = srcs.find(Boolean);
    let W = 595.28, H = 841.89;
    if (first && first.getPageCount()){ const sz = first.getPage(0).getSize(); W = sz.width; H = sz.height; }

    const jpg = await out.embedJpg(await renderCoverJpeg(W, H));
    out.addPage([W, H]).drawImage(jpg, { x:0, y:0, width:W, height:H });
    let ok = 0;
    for (const d of srcs){
      if (!d) continue;
      (await out.copyPages(d, d.getPageIndices())).forEach(pg => out.addPage(pg)); ok++;
    }
    out.setTitle(`${V.view.customer} 맞춤 제안서`); out.setAuthor(`IBK기업은행 ${V.view.branch.name}`);
    const bytes = await out.save();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type:'application/pdf' }));
    const ymd = (String(V.view.created || '').slice(0, 10).replaceAll('-', '')) || new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'}).replaceAll('-', '');
    a.download = `${V.view.customer.replace(/[\\/:*?"<>|]/g, '')}_${ymd}.pdf`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    if (ok < srcs.length) toast(`일부 상품(${srcs.length - ok}건)은 불러오지 못해 제외되었습니다.`);
  }catch(e){
    toast('전체 PDF를 만들지 못했습니다. 상품별 PDF 받기를 이용해 주세요.');
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
}

/* =====================================================================
   한 장씩 보는 뷰어: 표지 → 상품별 제안서(쪽 단위) , 다운로드 버튼
   ===================================================================== */
const V = { view:null, docs:[], slides:[], idx:0, zoom:false, token:0, task:null, ready:false, pageCache:new Map(), drawer:null };
let stage, vtitle, vprogText, vprogBar, btnPrev, btnNext, btnZoom, btnDown, coverEl;

function buildSlides(){
  const s = [{ t:'cover' }];
  V.view.items.forEach((it, i) => {
    const d = V.docs[i];
    const n = d ? d.numPages : 1;            // 불러오기 실패한 상품도 안내용 1쪽을 둠
    for (let p = 1; p <= n; p++) s.push({ t:'pdf', i, p, pages:n, failed:!d });
  });
  V.slides = s;
}

function buildViewer(view){
  V.view = view; V.idx = 0; V.zoom = false; V.ready = false; V.slides = [{ t:'cover' }];
  V.docs = view.items.map(() => null); V.pageCache.clear();
  document.body.classList.add('viewing');

  btnPrev = el('button', {class:'vbtn', type:'button', text:'◀', 'aria-label':'이전', onclick: () => go(V.idx - 1)});
  btnNext = el('button', {class:'vbtn primary', type:'button', text:'▶', 'aria-label':'다음', onclick: () => go(V.idx + 1)});
  btnZoom = el('button', {class:'vbtn', type:'button', text:'🔍 확대', onclick: toggleZoom});
  btnDown = el('button', {class:'vbtn primary', type:'button', text:'⬇ 전체 PDF', onclick: () => downloadAll(btnDown)});
  vtitle = el('div', {class:'vtitle'});
  vprogText = el('div', {});
  vprogBar = el('i', {});
  stage = el('div', {id:'stage'});

  app.replaceChildren(el('div', {id:'viewer'},
    el('div', {class:'vbar'},
      el('button', {class:'vbtn', type:'button', text:'☰ 목차', onclick: toggleDrawer}),
      vtitle, btnZoom, btnDown),
    stage,
    el('div', {class:'vfoot'}, btnPrev, el('div', {class:'vprog'}, vprogText, el('div', {class:'bar'}, vprogBar)), btnNext)));

  // 터치 스와이프(확대 중에는 끔)
  let tx = 0, ty = 0;
  stage.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
  stage.addEventListener('touchend', (e) => {
    if (V.zoom) return;
    const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(V.idx + (dx < 0 ? 1 : -1));
  }, {passive:true});

  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (V.slides[V.idx] && V.slides[V.idx].t === 'pdf') drawCurrent(); }, 150); });

  renderCurrent(0);

  // 모든 상품 PDF의 쪽수를 먼저 읽어 와 슬라이드 목록을 확정
  Promise.all(view.items.map((it, i) =>
    window.pdfjsLib.getDocument(it.product.url).promise.then(d => { V.docs[i] = d; }).catch(() => { V.docs[i] = null; })
  )).then(() => {
    buildSlides(); V.ready = true;
    if (V.idx === 0) renderCurrent(0);
    updateChrome();
  });
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('viewer')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(V.idx + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(V.idx - 1); }
  else if (e.key === 'Escape') closeDrawer();
});

function go(n){
  if (!V.ready) return;
  n = Math.max(0, Math.min(V.slides.length - 1, n));
  if (n === V.idx) return;
  const dir = n > V.idx ? 1 : -1;
  V.idx = n; V.zoom = false;
  closeDrawer();
  renderCurrent(dir);
}
function toggleZoom(){
  if (!V.slides[V.idx] || V.slides[V.idx].t !== 'pdf') return;
  V.zoom = !V.zoom; renderCurrent(0, true);
}
function downloadCurrent(i){
  const p = V.view.items[i].product; downloadPdf(p.url, p.filename);
}

function updateChrome(){
  const s = V.slides[V.idx], n = V.slides.length;
  if (s.t === 'cover'){
    vtitle.replaceChildren();   // 표지에서는 상단 제목(맞춤 제안서/고객명)을 표시하지 않음
  }else{
    const it = V.view.items[s.i];
    vtitle.replaceChildren(el('b', {text:`${pad2(s.i + 1)} · ${it.product.title}`}), el('span', {text:`${s.p} / ${s.pages}쪽`}));
  }
  btnDown.style.display = V.ready ? '' : 'none';
  btnZoom.style.display = s.t === 'pdf' && !s.failed ? '' : 'none';
  btnZoom.textContent = V.zoom ? '↔ 맞춤' : '🔍 확대';
  btnZoom.classList.toggle('on', V.zoom);
  btnPrev.disabled = !V.ready || V.idx === 0;
  btnNext.disabled = !V.ready || V.idx === n - 1;
  vprogText.textContent = `${V.idx + 1} / ${n}`;
  vprogBar.style.width = `${((V.idx + 1) / n) * 100}%`;
}

function renderCurrent(dir, keepAnim){
  const s = V.slides[V.idx];
  updateChrome();
  if (V.task){ try{ V.task.cancel(); }catch(e){} V.task = null; }
  if (s.t === 'cover'){
    stage.replaceChildren(buildCover());
    return;
  }
  const it = V.view.items[s.i];
  const slide = el('div', {class:'slide' + (dir < 0 ? ' back' : '')});
  if (keepAnim) slide.style.animation = 'none';
  const scroller = el('div', {class:'scroller'});
  const box = el('div', {class:'pagebox' + (V.zoom ? ' zoom' : '')}, scroller);
  slide.append(box);
  if (s.p === 1 && it.note) slide.append(el('div', {class:'caption'}, el('b', {text:'담당자 코멘트'}), it.note));
  stage.replaceChildren(slide);
  drawCurrent();
}

async function getPage(i, p){
  const key = i + ':' + p;
  if (!V.pageCache.has(key)) V.pageCache.set(key, V.docs[i].getPage(p));
  return V.pageCache.get(key);
}

async function drawCurrent(){
  const s = V.slides[V.idx]; if (!s || s.t !== 'pdf') return;
  const token = ++V.token;
  const box = stage.querySelector('.pagebox'); if (!box) return;
  const scroller = box.querySelector('.scroller');
  const it = V.view.items[s.i];

  if (!V.docs[s.i]){
    box.replaceChildren(el('div', {class:'msg'}, '이 상품의 PDF를 불러오지 못했습니다.', el('br'),
      el('a', {href:it.product.url, target:'_blank', rel:'noopener', text:'새 창에서 열기'})));
    return;
  }
  try{
    const page = await getPage(s.i, s.p);
    if (token !== V.token) return;
    const cs = getComputedStyle(box);
    const bw = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const bh = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const base = page.getViewport({ scale:1 });
    const fit = Math.min(bw / base.width, bh / base.height);
    const scale = V.zoom ? fit * 2.1 : fit;   // 확대 = 맞춤 크기의 약 2배(기기 크기와 무관하게 읽기 편한 배율)
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({ scale: scale * dpr });

    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
    canvas.style.width = (vp.width / dpr) + 'px'; canvas.style.height = (vp.height / dpr) + 'px';
    scroller.replaceChildren(canvas);
    const task = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
    V.task = task;
    await task.promise;
  }catch(e){
    if (e && e.name === 'RenderingCancelledException') return;
    if (token === V.token) box.replaceChildren(el('div', {class:'msg', text:'페이지를 표시하지 못했습니다. PDF 받기를 이용해 주세요.'}));
  }
}

const THEMES = [['navy','네이비','#14213D'],['blue','블루','#0A2F6B'],['emerald','에메랄드','#0B2E2A'],['burgundy','버건디','#3B1020'],['slate','슬레이트','#1F2937'],['gold','골드','#2A2111']];
function savedTheme(){ try { const t = localStorage.getItem('cover-theme'); return THEMES.some(x => x[0] === t) ? t : 'navy'; } catch (e) { return 'navy'; } }
function swatchRow(){
  const btns = THEMES.map(([id, label, color]) => el('button', {
    type:'button', class:'sw', title:label, 'aria-label':`표지 색상 ${label}`, style:`background:${color}`,
    'aria-pressed': String(id === savedTheme()),
    onclick: (e) => {
      coverEl.setAttribute('data-theme', id);
      try { localStorage.setItem('cover-theme', id); } catch (err) {}
      btns.forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget)));
    }}));
  return el('div', {class:'swatches'}, el('span', {text:'표지 색상'}), btns);
}
function buildCover(){
  const v = V.view, b = v.branch;
  const telText = b.tel + (b.telExt ? ` (${b.telExt})` : '');
  const meta = [];
  if (v.created) meta.push(el('span', {class:'chip', text:`제안일 ${fmtDate(v.created)}`}));
  if (v.expires) meta.push(el('span', {class:'chip', text:`유효기간 ~ ${fmtDate(v.expires)}`}));
  meta.push(el('span', {class:'chip', text:`제안 상품 ${v.items.length}건`}));

  const toc = el('ul', {class:'toc'}, v.items.map((it, i) => {
    const pages = V.docs[i] ? V.docs[i].numPages : it.product.pages;
    return el('li', {}, el('span', {class:'n', text:pad2(i + 1)}), el('span', {class:'t', text:it.product.title}),
              pages ? el('span', {class:'p', text:`${pages}쪽`}) : null);
  }));
  const cta = el('button', {class:'cta', type:'button', text: V.ready ? '제안서 보기  →' : '제안서를 불러오는 중…', onclick: () => go(1)});
  cta.disabled = !V.ready;
  coverEl = el('div', {class:'cover', 'data-theme': savedTheme()},
   el('div', {class:'cover-top'},
    el('p', {class:'eyebrow-badge'}, el('span', {class:'dot'}), `기업은행 ${b.name}`),
    el('img', {class:'ci', src:'/ci.png', alt:'IBK기업은행', onerror: (e) => e.target.remove()})),
   el('div', {class:'cover-in'},
    el('h1', {}, el('small', {text:'맞춤 제안서'}), `${v.customer} 고객님께`),
    v.greeting ? el('p', {class:'lead', text:v.greeting}) : null,
    el('div', {class:'meta'}, meta),
    toc, cta,
    el('button', {class:'cta2', type:'button', text:'⬇ 표지 포함 전체 PDF 저장', onclick: (e) => downloadAll(e.currentTarget)}),
    el('div', {class:'contact'}, el('b', {text:`${b.name} ${b.manager} 지점장`}), el('br'),
      '문의 ', el('a', {href:'tel:' + b.tel.replace(/[^0-9]/g, ''), text:telText})),
    swatchRow(),
    el('p', {class:'disc', text:'본 자료는 상담을 위한 참고용 제안서이며, 실제 상품 조건·금리·한도는 심사 및 거래 실적에 따라 달라질 수 있습니다. 가입 전 상품설명서와 약관을 확인해 주시기 바랍니다.'})));
  return coverEl;
}

/* ---- 목차 서랍: 표지/상품으로 이동 + 상품별 PDF 받기 ---- */
function closeDrawer(){ if (V.drawer){ V.drawer.forEach(n => n.remove()); V.drawer = null; } }
function toggleDrawer(){
  if (V.drawer){ closeDrawer(); return; }
  const cur = V.slides[V.idx];
  const jump = (i) => { const k = V.slides.findIndex(s => s.t === 'pdf' && s.i === i && s.p === 1); closeDrawer(); if (k >= 0) go(k); };
  const rows = [ el('div', {class:'dline' + (cur.t === 'cover' ? ' cur' : ''), onclick: () => { closeDrawer(); go(0); }},
                   el('span', {class:'n', text:'표지'}), el('span', {class:'t', text:V.view.customer})) ];
  V.view.items.forEach((it, i) => {
    const pages = V.docs[i] ? V.docs[i].numPages : it.product.pages;
    rows.push(el('div', {class:'dline' + (cur.t === 'pdf' && cur.i === i ? ' cur' : ''), onclick: () => jump(i)},
      el('span', {class:'n', text:pad2(i + 1)}),
      el('div', {class:'t'}, it.product.title, el('span', {text:[it.product.category, pages ? pages + '쪽' : ''].filter(Boolean).join(' · ')})),
      el('button', {class:'vbtn', type:'button', text:'⬇ PDF', onclick: (e) => { e.stopPropagation(); downloadCurrent(i); }})));
  });
  const bg = el('div', {class:'drawer-bg', onclick: closeDrawer});
  const dr = el('div', {class:'drawer'}, el('h3', {text:'목차'}), rows);
  stage.append(bg, dr); V.drawer = [bg, dr];
}

/* =====================================================================
   대체 화면: PDF.js를 못 불러오는 환경에서는 카드 목록 + 열기/다운로드
   ===================================================================== */
function buildListPage(view){
  document.body.classList.remove('viewing');
  const b = view.branch;
  const chips = [ el('span', {class:'chip', text:`제안 상품 ${view.items.length}건`}) ];
  if (view.expires) chips.push(el('span', {class:'chip', text:`유효기간 ~ ${fmtDate(view.expires)}`}));
  const telText = b.tel + (b.telExt ? ` (${b.telExt})` : '');

  const cards = view.items.map((it, i) => {
    const p = it.product;
    return el('article', {class:'item'},
      el('div', {class:'item-head'}, el('span', {class:'num', text:pad2(i + 1)}), el('span', {class:'cat', text:p.category || ''}),
        el('span', {class:'pages', text:p.pages ? `PDF ${p.pages}장` : ''})),
      el('h2', {text:p.title}), el('p', {class:'sum', text:p.summary || ''}),
      it.note ? el('div', {class:'note'}, el('b', {text:'담당자 코멘트  '}), it.note) : null,
      el('div', {class:'btns'},
        el('a', {class:'btn primary', href:p.url, target:'_blank', rel:'noopener', text:'열기'}),
        el('a', {class:'btn', href:p.url, text:'다운로드', onclick: (e) => { e.preventDefault(); downloadPdf(p.url, p.filename); }})));
  });
  app.replaceChildren(
    el('header', {class:'hero'}, el('div', {class:'hero-inner'},
      el('h1', {text:`${view.customer} 고객님께 드리는 제안서`}),
      view.greeting ? el('p', {class:'lead', text:view.greeting}) : null,
      el('div', {class:'chips'}, chips))),
    el('main', {class:'wrap'}, cards),
    el('p', {class:'disclaimer', text:'본 자료는 상담을 위한 참고용 제안서이며, 실제 상품 조건·금리·한도는 심사 및 거래 실적에 따라 달라질 수 있습니다.'}),
    el('div', {class:'bar-fixed'}, el('div', {class:'bar-inner'},
      el('div', {class:'bar-info'}, el('b', {text:`${b.name} ${b.manager} 지점장`}), telText),
      el('a', {class:'btn primary', href:'tel:' + b.tel.replace(/[^0-9]/g, ''), text:'전화 문의'}))));
}

/* view = { customer, greeting, expires, created, branch:{name,manager,tel,telExt}, items:[{note, product:{title,category,summary,pages,url,filename}}] } */
async function showProposal(view){
  document.title = `${view.customer} 맞춤 제안서 | IBK기업은행 ${view.branch.name}`;
  try{
    await withTimeout(loadPdfJs(), 8000);
  }catch(e){
    buildListPage(view); return;
  }
  buildViewer(view);
}

(async function init(){
  const code = new URLSearchParams(location.search).get('code');
  if (!code){
    showState('🔗', '제안서 링크가 올바르지 않습니다', '담당자에게 받은 전체 링크로 다시 접속해 주세요.');
    return;
  }
  const showExpired = (b) => showState('⏱️', '제안서 유효기간이 지났습니다', `담당자(${b.name} ${b.manager} 지점장, ${b.tel})에게 문의해 주세요.`);

  /* 1) DB(Supabase)에서 코드로 1건 조회 — 실제 고객 제안서 */
  let rpcFailed = false;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_proposal_by_code`, {
      method:'POST',
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_code: code })
    });
    if (!res.ok) throw new Error(res.status);
    const r = await res.json();
    if (r){
      const branch = { name:r.branch_name, manager:r.manager_name, tel:r.tel, telExt:r.tel_ext };
      if (r.expired){ showExpired(branch); return; }
      showProposal({
        customer:r.customer, greeting:r.greeting, expires:r.expires, created:r.created, branch,
        items:(r.items || []).map(i => ({ note:i.note, product:{
          title:i.title, category:i.category, summary:i.summary, pages:i.pages,
          url:`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${i.pdf_path}`,
          filename:`${i.title}.pdf` } }))
      });
      return;
    }
  }catch(e){ rpcFailed = true; }

  /* 2) DB에 없으면 샘플(sample01, sample02) 예비 데이터 확인 */
  let data;
  try{
    const res = await fetch(DATA_URL, {cache:'no-cache'});
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  }catch(e){
    showState('⚠️', '제안서를 불러오지 못했습니다', '잠시 후 다시 시도해 주세요.');
    return;
  }
  const proposal = Object.prototype.hasOwnProperty.call(data.proposals, code) ? data.proposals[code] : null;
  if (!proposal){
    if (rpcFailed) showState('⚠️', '제안서를 불러오지 못했습니다', '잠시 후 다시 시도해 주세요.');
    else showState('🔍', '제안서를 찾을 수 없습니다', '링크가 정확한지 확인하시거나 담당자에게 문의해 주세요.');
    return;
  }
  const branch = { name:data.branch.name, manager:data.branch.manager, tel:data.branch.tel, telExt:data.branch.telExt };
  if (proposal.expires && isExpired(proposal.expires)){ showExpired(branch); return; }
  showProposal({
    customer:proposal.customer, greeting:proposal.greeting, expires:proposal.expires, branch,
    items:(proposal.items || []).filter(it => data.products[it.product]).map(it => {
      const p = data.products[it.product];
      return { note:it.note, product:{ title:p.title, category:p.category, summary:p.summary, pages:p.pages,
                                       url:PDF_BASE + p.pdf, filename:p.pdf } };
    })
  });
})();
</script>
